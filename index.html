<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Offline SenseVoice speech recognition powered by sherpa-onnx WebAssembly."
  />

  <title>SenseVoice 語音輸入</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0f14;
      color: #e8edf3;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(24px, env(safe-area-inset-bottom))
        16px;
    }

    .container {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 28px;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #98a2b3;
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: #111720;
      border: 1px solid #202936;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 24px;
      margin-bottom: 14px;
      color: #b8c1ce;
      font-size: 14px;
    }

    .statusDot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #667085;
    }

    .statusDot.ready {
      background: #22c55e;
    }

    .statusDot.loading {
      background: #f59e0b;
    }

    .statusDot.error {
      background: #ef4444;
    }

    .statusDot.recording {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    button {
      appearance: none;
      width: 100%;
      min-height: 48px;
      border: 1px solid #2b3544;
      border-radius: 12px;
      background: #18202b;
      color: #eef2f7;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.05s ease,
        opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #202a37;
      border-color: #3a4658;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #loadBtn {
      background: #1d4ed8;
      border-color: #2563eb;
    }

    #loadBtn:hover:not(:disabled) {
      background: #2563eb;
    }

    #micBtn.recording {
      background: #991b1b;
      border-color: #dc2626;
    }

    #clearBtn {
      color: #cbd5e1;
    }

    .progressBox {
      margin-top: 16px;
    }

    .progressInfo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #b8c1ce;
      font-size: 13px;
    }

    #progressPercent {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .progressBar {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #202936;
    }

    #progressFill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #3b82f6;
      transition: width 0.12s linear;
    }

    .resultLabel {
      margin-bottom: 10px;
      color: #98a2b3;
      font-size: 13px;
    }

    #result {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #2b3544;
      border-radius: 12px;
      outline: none;
      background: #0c1118;
      color: #f1f5f9;
      font-size: 18px;
      line-height: 1.7;
      font-family: inherit;
    }

    #result:focus {
      border-color: #3b82f6;
    }

    .info {
      color: #7f8a9b;
      font-size: 12px;
      line-height: 1.7;
    }

    .info strong {
      color: #aab4c2;
    }

    .errorBox {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      background: #2a1114;
      color: #fecaca;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.6;
    }

    .errorBox.show {
      display: block;
    }

    @media (min-width: 560px) {
      .buttons {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>SenseVoice 語音輸入</h1>

    <p class="subtitle">
      本地端 WebAssembly 語音辨識，不需要把錄音上傳到伺服器。
    </p>

    <section class="card">

      <div class="status">
        <span id="statusDot" class="statusDot"></span>
        <span id="statusText">尚未載入模型</span>
      </div>

      <div class="buttons">
        <button id="loadBtn">載入模型</button>
        <button id="micBtn" disabled>開始錄音</button>
        <button id="clearBtn">清除文字</button>
      </div>

      <div id="progressBox" class="progressBox" hidden>
        <div class="progressInfo">
          <span id="progressText">準備下載…</span>
          <span id="progressPercent">0%</span>
        </div>

        <div class="progressBar">
          <div id="progressFill"></div>
        </div>
      </div>

      <div id="errorBox" class="errorBox"></div>

    </section>

    <section class="card">

      <div class="resultLabel">
        辨識結果
      </div>

      <textarea
        id="result"
        placeholder="語音辨識結果會出現在這裡…"
        spellcheck="false"
      ></textarea>

    </section>

    <section class="card info">

      <div>
        <strong>模型：</strong>
        SenseVoice INT8
      </div>

      <div>
        <strong>模型來源：</strong>
        Hugging Face
      </div>

      <div>
        <strong>推論：</strong>
        sherpa-onnx + WebAssembly
      </div>

      <div>
        <strong>模式：</strong>
        Offline / CPU
      </div>

    </section>

  </main>

  <!--
    Emscripten Module 必須在 sherpa-onnx WASM JS 載入前設定。
  -->
  <script>
    var Module = {
      locateFile: function (path) {
        return "./assets/" + path;
      }
    };
  </script>

  <script src="./assets/sherpa-onnx-asr.js"></script>
  <script src="./assets/sherpa-onnx-wasm-web.js"></script>

  <script>
    "use strict";

    /* =========================================================
       Hugging Face model
       ========================================================= */

    const MODEL_URL =
      "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/model.int8.onnx";

    const TOKENS_URL =
      "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/tokens.txt";

    /*
      如果 Hugging Face 更新模型，
      可以把版本鎖到特定 commit。

      目前先使用 main。
    */

    const MODEL_CACHE_NAME =
      "sensevoice-model-v1";

    const MODEL_CACHE_KEY =
      MODEL_URL;

    /* =========================================================
       DOM
       ========================================================= */

    const loadBtn =
      document.getElementById("loadBtn");

    const micBtn =
      document.getElementById("micBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    const progressBox =
      document.getElementById("progressBox");

    const progressText =
      document.getElementById("progressText");

    const progressPercent =
      document.getElementById("progressPercent");

    const progressFill =
      document.getElementById("progressFill");

    const resultBox =
      document.getElementById("result");

    const errorBox =
      document.getElementById("errorBox");

    /* =========================================================
       State
       ========================================================= */

    let recognizer = null;

    let audioContext = null;

    let mediaStream = null;

    let sourceNode = null;

    let processorNode = null;

    let silentGain = null;

    let audioChunks = [];

    let isRecording = false;

    let isLoading = false;

    /* =========================================================
       UI
       ========================================================= */

    function setStatus(
      text,
      type = ""
    ) {
      statusText.textContent = text;

      statusDot.className =
        "statusDot";

      if (type) {
        statusDot.classList.add(type);
      }
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.remove("show");
    }

    function showError(error) {
      console.error(error);

      const message =
        error instanceof Error
          ? error.message
          : String(error);

      errorBox.textContent =
        message;

      errorBox.classList.add("show");

      setStatus(
        "發生錯誤",
        "error"
      );
    }

    function formatBytes(bytes) {
      if (
        !Number.isFinite(bytes) ||
        bytes < 0
      ) {
        return "0 B";
      }

      if (bytes < 1024) {
        return `${bytes} B`;
      }

      if (
        bytes <
        1024 * 1024
      ) {
        return `${(
          bytes / 1024
        ).toFixed(1)} KB`;
      }

      if (
        bytes <
        1024 * 1024 * 1024
      ) {
        return `${(
          bytes /
          1024 /
          1024
        ).toFixed(1)} MB`;
      }

      return `${(
        bytes /
        1024 /
        1024 /
        1024
      ).toFixed(2)} GB`;
    }

    function setProgress(
      received,
      total
    ) {
      progressBox.hidden = false;

      if (
        total > 0 &&
        Number.isFinite(total)
      ) {
        const percent =
          Math.min(
            100,
            Math.floor(
              received /
              total *
              100
            )
          );

        progressText.textContent =
          `下載模型 ${formatBytes(received)} / ${formatBytes(total)}`;

        progressPercent.textContent =
          `${percent}%`;

        progressFill.style.width =
          `${percent}%`;

      } else {

        progressText.textContent =
          `下載模型 ${formatBytes(received)}`;

        progressPercent.textContent =
          "";

        /*
          沒有 Content-Length 時，
          不假裝知道百分比。
        */
        progressFill.style.width =
          "100%";
      }
    }

    function finishProgress() {
      progressText.textContent =
        "模型下載完成";

      progressPercent.textContent =
        "100%";

      progressFill.style.width =
        "100%";
    }

    /* =========================================================
       Model Cache
       ========================================================= */

    async function getCachedModelResponse() {
      if (
        !("caches" in window)
      ) {
        return null;
      }

      try {
        const cache =
          await caches.open(
            MODEL_CACHE_NAME
          );

        return await cache.match(
          MODEL_CACHE_KEY
        );

      } catch (error) {
        console.warn(
          "Model cache read failed:",
          error
        );

        return null;
      }
    }

    async function saveModelToCache(
      response
    ) {
      if (
        !("caches" in window)
      ) {
        return;
      }

      try {
        const cache =
          await caches.open(
            MODEL_CACHE_NAME
          );

        await cache.put(
          MODEL_CACHE_KEY,
          response
        );

        console.log(
          "SenseVoice model cached."
        );

      } catch (error) {
        /*
          Cache 失敗不能讓模型載入失敗。
        */
        console.warn(
          "Model cache write failed:",
          error
        );
      }
    }

    async function clearModelCache() {
      if (
        !("caches" in window)
      ) {
        return;
      }

      try {
        await caches.delete(
          MODEL_CACHE_NAME
        );
      } catch (_) {}
    }

    /* =========================================================
       Download
       ========================================================= */

    async function fetchModelWithProgress(
      url
    ) {
      /*
        先嘗試 Cache Storage。
      */
      const cached =
        await getCachedModelResponse();

      if (cached) {
        console.log(
          "Using cached SenseVoice model."
        );

        return cached;
      }

      /*
        第一次從 Hugging Face 下載。
      */
      const response =
        await fetch(
          url,
          {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "default"
          }
        );

      if (!response.ok) {
        throw new Error(
          `Hugging Face 模型下載失敗：HTTP ${response.status} ${response.statusText}`
        );
      }

      if (!response.body) {
        throw new Error(
          "瀏覽器不支援 ReadableStream，無法顯示模型下載進度。"
        );
      }

      /*
        Clone 一份給 Cache Storage。

        原始 response 用來讀取 stream。
      */
      const cacheResponse =
        response.clone();

      /*
        背景快取。

        不 await，避免阻塞模型下載。
      */
      saveModelToCache(
        cacheResponse
      );

      return response;
    }

    async function responseToUint8Array(
      response,
      onProgress
    ) {
      if (!response.body) {
        throw new Error(
          "模型 response 沒有 body。"
        );
      }

      const contentLength =
        response.headers.get(
          "Content-Length"
        );

      const total =
        contentLength &&
        Number.isFinite(
          Number(contentLength)
        )
          ? Number(contentLength)
          : 0;

      const reader =
        response.body.getReader();

      const chunks = [];

      let received = 0;

      while (true) {
        const { done, value } =
          await reader.read();

        if (done) {
          break;
        }

        if (
          value &&
          value.byteLength
        ) {
          chunks.push(value);

          received +=
            value.byteLength;

          onProgress(
            received,
            total
          );
        }
      }

      const data =
        new Uint8Array(
          received
        );

      let offset = 0;

      for (
        const chunk of chunks
      ) {
        data.set(
          chunk,
          offset
        );

        offset +=
          chunk.byteLength;
      }

      return data;
    }

    async function fetchTokens() {
      const response =
        await fetch(
          TOKENS_URL,
          {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "default"
          }
        );

      if (!response.ok) {
        throw new Error(
          `tokens.txt 下載失敗：HTTP ${response.status}`
        );
      }

      return await response.text();
    }

    /* =========================================================
       Emscripten FS
       ========================================================= */

    function getEmscriptenFS() {

      if (
        typeof Module !== "undefined" &&
        Module.FS &&
        typeof Module.FS.writeFile ===
          "function"
      ) {
        return Module.FS;
      }

      if (
        typeof globalThis !== "undefined" &&
        globalThis.FS &&
        typeof globalThis.FS.writeFile ===
          "function"
      ) {
        return globalThis.FS;
      }

      return null;
    }

    function removeWasmFile(
      fs,
      path
    ) {
      try {
        if (
          fs &&
          typeof fs.unlink ===
            "function"
        ) {
          fs.unlink(path);
        }
      } catch (_) {}
    }

    function writeWasmFile(
      path,
      data
    ) {
      const fs =
        getEmscriptenFS();

      if (fs) {
        fs.writeFile(
          path,
          data
        );

        return;
      }

      /*
        舊版相容。
      */
      if (
        typeof Module !== "undefined" &&
        typeof Module.FS_createDataFile ===
          "function"
      ) {

        const slash =
          path.lastIndexOf("/");

        const dir =
          slash <= 0
            ? "/"
            : path.substring(
                0,
                slash
              );

        const filename =
          path.substring(
            slash + 1
          );

        Module.FS_createDataFile(
          dir,
          filename,
          data,
          true,
          true
        );

        return;
      }

      throw new Error(
        [
          "WebAssembly 沒有提供 Emscripten FS。",
          "",
          "找不到：",
          "Module.FS.writeFile",
          "globalThis.FS.writeFile",
          "Module.FS_createDataFile",
          "",
          "請確認 GitHub Actions 使用本頁提供的 YAML，",
          "該 YAML 會在編譯 WASM 時 export FS。"
        ].join("\n")
      );
    }

    function writeModelToWasmFS(
      modelData,
      tokensText
    ) {
      const fs =
        getEmscriptenFS();

      if (fs) {
        removeWasmFile(
          fs,
          "/model.int8.onnx"
        );

        removeWasmFile(
          fs,
          "/tokens.txt"
        );
      }

      writeWasmFile(
        "/model.int8.onnx",
        modelData
      );

      writeWasmFile(
        "/tokens.txt",
        tokensText
      );
    }

    /* =========================================================
       Load Model
       ========================================================= */

    async function loadModel() {

      if (isLoading) {
        return;
      }

      if (recognizer) {
        setStatus(
          "模型已經載入",
          "ready"
        );

        return;
      }

      isLoading = true;

      loadBtn.disabled = true;

      clearError();

      try {

        setStatus(
          "檢查模型快取…",
          "loading"
        );

        progressBox.hidden = false;

        progressText.textContent =
          "準備下載…";

        progressPercent.textContent =
          "0%";

        progressFill.style.width =
          "0%";

        /*
          Hugging Face
        */
        const modelResponse =
          await fetchModelWithProgress(
            MODEL_URL
          );

        setStatus(
          "下載 SenseVoice INT8 模型…",
          "loading"
        );

        const modelData =
          await responseToUint8Array(
            modelResponse,
            (
              received,
              total
            ) => {
              setProgress(
                received,
                total
              );
            }
          );

        console.log(
          "SenseVoice model:",
          formatBytes(
            modelData.byteLength
          )
        );

        finishProgress();

        /*
          tokens.txt
        */
        setStatus(
          "下載 tokens.txt…",
          "loading"
        );

        const tokensText =
          await fetchTokens();

        /*
          寫入 WASM FS
        */
        setStatus(
          "準備 WebAssembly 模型…",
          "loading"
        );

        writeModelToWasmFS(
          modelData,
          tokensText
        );

        /*
          建立 OfflineRecognizer
        */
        setStatus(
          "初始化 SenseVoice…",
          "loading"
        );

        recognizer =
          new OfflineRecognizer(
            {
              featConfig: {
                sampleRate: 16000,
                featureDim: 80
              },

              modelConfig: {
                tokens:
                  "./tokens.txt",

                numThreads: 2,

                provider: "cpu",

                debug: 0,

                senseVoice: {
                  model:
                    "./model.int8.onnx",

                  /*
                    SenseVoice 語言：

                    zh = 中文
                    en = 英文
                    ja = 日文
                    ko = 韓文
                    yue = 粵語

                    目前預設中文。
                  */
                  language: "zh",

                  useInverseTextNormalization:
                    1
                }
              },

              decodingMethod:
                "greedy_search"
            },

            Module
          );

        setStatus(
          "模型已載入，可以開始錄音",
          "ready"
        );

        micBtn.disabled =
          false;

      } catch (error) {

        recognizer = null;

        showError(
          `載入失敗：${
            error instanceof Error
              ? error.message
              : String(error)
          }`
        );

      } finally {

        isLoading = false;

        loadBtn.disabled =
          false;
      }
    }

    /* =========================================================
       Audio
       ========================================================= */

    function mergeFloat32Arrays(
      chunks
    ) {
      let totalLength = 0;

      for (
        const chunk of chunks
      ) {
        totalLength +=
          chunk.length;
      }

      const result =
        new Float32Array(
          totalLength
        );

      let offset = 0;

      for (
        const chunk of chunks
      ) {
        result.set(
          chunk,
          offset
        );

        offset +=
          chunk.length;
      }

      return result;
    }

    /*
      Linear resampler。

      iPhone Safari 常見 48000 Hz，
      SenseVoice 使用 16000 Hz。
    */
    function resampleLinear(
      input,
      inputSampleRate,
      outputSampleRate
    ) {

      if (
        inputSampleRate ===
        outputSampleRate
      ) {
        return input;
      }

      const ratio =
        inputSampleRate /
        outputSampleRate;

      const outputLength =
        Math.max(
          1,
          Math.round(
            input.length /
            ratio
          )
        );

      const output =
        new Float32Array(
          outputLength
        );

      for (
        let i = 0;
        i < outputLength;
        i++
      ) {

        const position =
          i * ratio;

        const index =
          Math.floor(
            position
          );

        const fraction =
          position - index;

        const a =
          input[
            Math.min(
              index,
              input.length - 1
            )
          ];

        const b =
          input[
            Math.min(
              index + 1,
              input.length - 1
            )
          ];

        output[i] =
          a +
          (b - a) *
          fraction;
      }

      return output;
    }

    /* =========================================================
       Start Recording
       ========================================================= */

    async function startRecording() {

      if (!recognizer) {
        throw new Error(
          "請先載入模型。"
        );
      }

      if (isRecording) {
        return;
      }

      clearError();

      mediaStream =
        await navigator.mediaDevices.getUserMedia(
          {
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          }
        );

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      if (
        audioContext.state ===
        "suspended"
      ) {
        await audioContext.resume();
      }

      const sampleRate =
        audioContext.sampleRate;

      console.log(
        "Audio sample rate:",
        sampleRate
      );

      sourceNode =
        audioContext.createMediaStreamSource(
          mediaStream
        );

      processorNode =
        audioContext.createScriptProcessor(
          4096,
          1,
          1
        );

      silentGain =
        audioContext.createGain();

      silentGain.gain.value =
        0;

      audioChunks = [];

      processorNode.onaudioprocess =
        event => {

          if (!isRecording) {
            return;
          }

          const input =
            event.inputBuffer.getChannelData(
              0
            );

          audioChunks.push(
            new Float32Array(
              input
            )
          );
        };

      sourceNode.connect(
        processorNode
      );

      processorNode.connect(
        silentGain
      );

      silentGain.connect(
        audioContext.destination
      );

      isRecording = true;

      micBtn.textContent =
        "停止錄音";

      micBtn.classList.add(
        "recording"
      );

      loadBtn.disabled =
        true;

      setStatus(
        `錄音中（${sampleRate} Hz）…`,
        "recording"
      );
    }

    /* =========================================================
       Stop Recording
       ========================================================= */

    function disconnectAudio() {

      if (processorNode) {
        try {
          processorNode.disconnect();
        } catch (_) {}
      }

      if (sourceNode) {
        try {
          sourceNode.disconnect();
        } catch (_) {}
      }

      if (silentGain) {
        try {
          silentGain.disconnect();
        } catch (_) {}
      }

      if (mediaStream) {

        for (
          const track
          of mediaStream.getTracks()
        ) {
          try {
            track.stop();
          } catch (_) {}
        }
      }

      processorNode = null;
      sourceNode = null;
      silentGain = null;
      mediaStream = null;
    }

    async function stopRecording() {

      if (!isRecording) {
        return;
      }

      isRecording = false;

      micBtn.textContent =
        "開始錄音";

      micBtn.classList.remove(
        "recording"
      );

      loadBtn.disabled =
        true;

      micBtn.disabled =
        true;

      const currentAudioContext =
        audioContext;

      const originalSampleRate =
        currentAudioContext
          ? currentAudioContext.sampleRate
          : 48000;

      disconnectAudio();

      try {

        setStatus(
          "整理錄音…",
          "loading"
        );

        const inputSamples =
          mergeFloat32Arrays(
            audioChunks
          );

        audioChunks = [];

        if (
          inputSamples.length === 0
        ) {
          throw new Error(
            "沒有取得任何麥克風音訊。"
          );
        }

        /*
          16 kHz
        */
        setStatus(
          "轉換成 16 kHz…",
          "loading"
        );

        const samples16k =
          resampleLinear(
            inputSamples,
            originalSampleRate,
            16000
          );

        console.log(
          "Original samples:",
          inputSamples.length
        );

        console.log(
          "Resampled samples:",
          samples16k.length
        );

        /*
          關閉 AudioContext
        */
        if (
          currentAudioContext
        ) {
          try {
            await currentAudioContext.close();
          } catch (_) {}
        }

        audioContext =
          null;

        /*
          建立 recognizer stream
        */
        const stream =
          recognizer.createStream();

        stream.acceptWaveform(
          {
            samples:
              samples16k,

            sampleRate:
              16000
          }
        );

        setStatus(
          "辨識中…",
          "loading"
        );

        let result;

        /*
          新 API
        */
        if (
          typeof recognizer.decodeAsync ===
          "function"
        ) {

          result =
            await recognizer.decodeAsync(
              stream
            );

        } else {

          /*
            舊 API fallback
          */
          recognizer.decode(
            stream
          );

          result =
            recognizer.getResult(
              stream
            );
        }

        /*
          有些版本 decodeAsync
          不直接回傳 result。
        */
        if (
          !result ||
          typeof result.text !==
            "string"
        ) {
          result =
            recognizer.getResult(
              stream
            );
        }

        const text =
          result &&
          typeof result.text ===
            "string"
            ? result.text.trim()
            : "";

        if (text) {

          resultBox.value =
            text;

        } else {

          resultBox.value =
            "（沒有辨識到文字）";
        }

        console.log(
          "SenseVoice result:",
          result
        );

        setStatus(
          "辨識完成，可以再次錄音",
          "ready"
        );

      } catch (error) {

        showError(
          `辨識失敗：${
            error instanceof Error
              ? error.message
              : String(error)
          }`
        );

      } finally {

        micBtn.disabled =
          !recognizer;

        loadBtn.disabled =
          false;
      }
    }

    /* =========================================================
       Buttons
       ========================================================= */

    loadBtn.addEventListener(
      "click",
      async () => {

        try {
          await loadModel();
        } catch (error) {
          showError(error);
        }

      }
    );

    micBtn.addEventListener(
      "click",
      async () => {

        try {

          clearError();

          if (!isRecording) {
            await startRecording();
          } else {
            await stopRecording();
          }

        } catch (error) {

          showError(error);

          isRecording =
            false;

          micBtn.textContent =
            "開始錄音";

          micBtn.classList.remove(
            "recording"
          );

          micBtn.disabled =
            !recognizer;

          loadBtn.disabled =
            false;
        }

      }
    );

    clearBtn.addEventListener(
      "click",
      () => {

        resultBox.value = "";

        clearError();

        if (recognizer) {
          setStatus(
            "模型已載入，可以開始錄音",
            "ready"
          );
        }
      }
    );

    /* =========================================================
       Lifecycle
       ========================================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        if (mediaStream) {

          for (
            const track
            of mediaStream.getTracks()
          ) {
            try {
              track.stop();
            } catch (_) {}
          }
        }

        if (audioContext) {
          try {
            audioContext.close();
          } catch (_) {}
        }

      }
    );

    /* =========================================================
       Service Worker
       ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        async () => {

          try {

            await navigator.serviceWorker.register(
              "./sw.js"
            );

            console.log(
              "Service Worker registered."
            );

          } catch (error) {

            console.warn(
              "Service Worker registration failed:",
              error
            );
          }

        }
      );
    }

    /* =========================================================
       Initial
       ========================================================= */

    setStatus(
      "尚未載入模型"
    );

    console.log(
      "SenseVoice initialized."
    );

  </script>
</body>
</html>
