<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>SenseVoice 中文語音輸入</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111827;
      color: #f9fafb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    body {
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin: 4px;
      font-size: 15px;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button:hover {
      background: #4b5563;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .danger {
      background: #dc2626;
    }

    .progress-wrap {
      margin-top: 16px;
    }

    progress {
      width: 100%;
      height: 18px;
    }

    .status {
      margin-top: 10px;
      color: #d1d5db;
      white-space: pre-wrap;
      word-break: break-word;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #4b5563;
      background: #111827;
      color: white;
      padding: 16px;
      font-size: 18px;
      line-height: 1.7;
      outline: none;
    }

    textarea:focus {
      border-color: #60a5fa;
    }

    .small {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.6;
    }

    .ok {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .recording {
      background: #b91c1c;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SenseVoice 中文語音輸入</h1>

  <div class="subtitle">
    sherpa-onnx + SenseVoice INT8 + WebAssembly
  </div>

  <!-- ============================================================
       Model
       ============================================================ -->

  <div class="card">

    <button
      id="loadModelBtn"
      class="primary"
    >
      載入模型
    </button>

    <button
      id="micBtn"
      disabled
    >
      🎤 開始錄音
    </button>

    <button
      id="clearBtn"
    >
      清除文字
    </button>

    <div class="progress-wrap">

      <progress
        id="progress"
        value="0"
        max="100"
      ></progress>

      <div
        id="progressText"
        class="status"
      >
        尚未載入模型
      </div>

    </div>

  </div>


  <!-- ============================================================
       Result
       ============================================================ -->

  <div class="card">

    <textarea
      id="result"
      placeholder="語音辨識結果會出現在這裡..."
    ></textarea>

  </div>


  <!-- ============================================================
       Debug
       ============================================================ -->

  <div class="card">

    <div class="small">
      <strong>Runtime:</strong>
      <span id="runtimeStatus">尚未初始化</span>
    </div>

    <div
      id="debug"
      class="small"
      style="margin-top:10px;"
    ></div>

  </div>

</div>


<script>
"use strict";

/* ================================================================
   URLs
   ================================================================ */

const MODEL_URL =
  "https://huggingface.co/csukuangfj/" +
  "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/" +
  "resolve/main/model.int8.onnx";

const TOKENS_URL =
  "https://huggingface.co/csukuangfj/" +
  "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/" +
  "resolve/main/tokens.txt";


/* ================================================================
   DOM
   ================================================================ */

const loadModelBtn = document.getElementById("loadModelBtn");
const micBtn = document.getElementById("micBtn");
const clearBtn = document.getElementById("clearBtn");

const progress = document.getElementById("progress");
const progressText = document.getElementById("progressText");

const resultText = document.getElementById("result");

const runtimeStatus = document.getElementById("runtimeStatus");
const debug = document.getElementById("debug");


/* ================================================================
   Global runtime state
   ================================================================ */

let wasmModule = null;
let recognizer = null;

let audioContext = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;
let silentGain = null;

let audioChunks = [];

let isRecording = false;


/* ================================================================
   Debug
   ================================================================ */

function logDebug(message) {
  console.log("[SenseVoice]", message);

  debug.textContent +=
    (debug.textContent ? "\n" : "") +
    message;
}


/* ================================================================
   Number formatting
   ================================================================ */

function formatMB(bytes) {
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}


/* ================================================================
   Fetch ArrayBuffer with progress
   ================================================================ */

async function fetchWithProgress(url, label) {

  const response = await fetch(
    url,
    {
      method: "GET",
      mode: "cors",
      credentials: "omit",
      cache: "default"
    }
  );

  if (!response.ok) {
    throw new Error(
      `${label} HTTP ${response.status}`
    );
  }

  const contentLength =
    Number(response.headers.get("content-length")) || 0;

  /*
   * 如果瀏覽器拿不到 Content-Length，
   * 仍然可以下載，只是 progress 無法顯示百分比。
   */

  if (!response.body) {
    const buffer = await response.arrayBuffer();

    progress.value = 100;

    progressText.textContent =
      `${label}: ${formatMB(buffer.byteLength)}`;

    return new Uint8Array(buffer);
  }

  const reader = response.body.getReader();

  const chunks = [];

  let received = 0;

  while (true) {

    const { done, value } =
      await reader.read();

    if (done) {
      break;
    }

    if (value) {

      chunks.push(value);

      received += value.byteLength;

      if (contentLength > 0) {

        const percent =
          received / contentLength * 100;

        progress.value = percent;

        progressText.textContent =
          `${label}: ` +
          `${percent.toFixed(1)}% ` +
          `(${formatMB(received)} / ` +
          `${formatMB(contentLength)})`;

      } else {

        progressText.textContent =
          `${label}: ` +
          `${formatMB(received)}`;

      }
    }
  }

  const output =
    new Uint8Array(received);

  let offset = 0;

  for (const chunk of chunks) {

    output.set(
      chunk,
      offset
    );

    offset += chunk.byteLength;
  }

  progress.value = 100;

  progressText.textContent =
    `${label}: ` +
    `${formatMB(output.byteLength)}`;

  return output;
}


/* ================================================================
   Decode UTF-8 tokens.txt
   ================================================================ */

function decodeText(bytes) {

  return new TextDecoder(
    "utf-8"
  ).decode(bytes);

}


/* ================================================================
   Create Emscripten Module instance
   ================================================================ */

async function createWasmModule() {

  runtimeStatus.textContent =
    "載入 WebAssembly runtime...";

  logDebug(
    "開始載入 sherpa-onnx-wasm-web.js"
  );

  /*
   * IMPORTANT
   *
   * sherpa-onnx 的 Web build 是 Emscripten
   * MODULARIZE build。
   *
   * 因此：
   *
   * sherpa-onnx-wasm-web.js
   *
   * 載入後取得的是 Module factory，
   * 不是可以直接拿來 FS.writeFile 的 instance。
   *
   * 我們必須呼叫 factory。
   */

  if (
    typeof window.SherpaOnnx === "function"
  ) {

    logDebug(
      "找到 window.SherpaOnnx() factory"
    );

    const ModuleFactory =
      window.SherpaOnnx;

    wasmModule =
      await ModuleFactory({

        locateFile: function(path) {

          return "./assets/" + path;

        },

        print: function(text) {
          console.log(
            "[WASM]",
            text
          );
        },

        printErr: function(text) {
          console.error(
            "[WASM]",
            text
          );
        }

      });

    return wasmModule;
  }


  /*
   * 某些 Emscripten build 會把 factory
   * 暴露成 window.Module。
   */

  if (
    typeof window.Module === "function"
  ) {

    logDebug(
      "找到 window.Module() factory"
    );

    const ModuleFactory =
      window.Module;

    wasmModule =
      await ModuleFactory({

        locateFile: function(path) {

          return "./assets/" + path;

        }

      });

    return wasmModule;
  }


  /*
   * 最後嘗試等待 Module。
   *
   * 注意：
   * 如果它本身已經是 object，
   * 就直接使用。
   */

  if (
    window.Module &&
    typeof window.Module === "object"
  ) {

    logDebug(
      "找到既有 Emscripten Module instance"
    );

    wasmModule =
      window.Module;

    return wasmModule;
  }


  throw new Error(
    "找不到 Emscripten Module factory。"
  );
}


/* ================================================================
   Verify Emscripten FS
   ================================================================ */

function verifyFS() {

  if (!wasmModule) {

    throw new Error(
      "WASM Module 尚未初始化。"
    );

  }

  logDebug(
    "Module constructor: " +
    (
      wasmModule.constructor &&
      wasmModule.constructor.name
        ? wasmModule.constructor.name
        : "unknown"
    )
  );


  if (
    wasmModule.FS &&
    typeof wasmModule.FS.writeFile === "function"
  ) {

    logDebug(
      "OK: wasmModule.FS.writeFile 可用"
    );

    return wasmModule.FS;
  }


  /*
   * 某些 Emscripten 版本會提供
   * global FS。
   */

  if (
    typeof window.FS === "object" &&
    typeof window.FS.writeFile === "function"
  ) {

    logDebug(
      "OK: window.FS.writeFile 可用"
    );

    return window.FS;
  }


  throw new Error(
    "Emscripten Module 已初始化，但 FS.writeFile 不存在。"
  );
}


/* ================================================================
   Write file into WASM virtual filesystem
   ================================================================ */

function writeWasmFile(
  filename,
  data
) {

  const FS =
    verifyFS();

  logDebug(
    `寫入 WASM FS: ${filename} ` +
    `(${formatMB(data.byteLength)})`
  );

  FS.writeFile(
    "/" + filename,
    data
  );

  logDebug(
    `FS.writeFile 完成: /${filename}`
  );
}


/* ================================================================
   Load sherpa-onnx ASR JavaScript API
   ================================================================ */

async function loadAsrApi() {

  if (
    typeof window.OfflineRecognizer ===
    "function"
  ) {

    logDebug(
      "OfflineRecognizer 已存在"
    );

    return;
  }

  logDebug(
    "載入 sherpa-onnx-asr.js"
  );

  await new Promise(
    (resolve, reject) => {

      const script =
        document.createElement("script");

      script.src =
        "./assets/sherpa-onnx-asr.js";

      script.onload =
        resolve;

      script.onerror =
        () => reject(
          new Error(
            "sherpa-onnx-asr.js 載入失敗"
          )
        );

      document.head.appendChild(
        script
      );

    }
  );


  if (
    typeof window.OfflineRecognizer !==
    "function"
  ) {

    throw new Error(
      "sherpa-onnx-asr.js 載入成功，但 OfflineRecognizer 不存在。"
    );

  }

  logDebug(
    "OfflineRecognizer API OK"
  );
}


/* ================================================================
   Load model
   ================================================================ */

async function loadModel() {

  loadModelBtn.disabled = true;

  progress.value = 0;

  progressText.textContent =
    "正在初始化 WebAssembly...";

  runtimeStatus.textContent =
    "初始化中...";

  debug.textContent = "";

  try {

    /* ------------------------------------------------------------
       1. Load WASM JS
       ------------------------------------------------------------ */

    await loadWasmScript();


    /* ------------------------------------------------------------
       2. Create actual Emscripten Module
       ------------------------------------------------------------ */

    await createWasmModule();

    runtimeStatus.textContent =
      "WebAssembly 已初始化";

    logDebug(
      "Emscripten Module 初始化完成"
    );


    /* ------------------------------------------------------------
       3. Verify FS
       ------------------------------------------------------------ */

    verifyFS();


    /* ------------------------------------------------------------
       4. Load sherpa-onnx JS API
       ------------------------------------------------------------ */

    await loadAsrApi();


    /* ------------------------------------------------------------
       5. Download model
       ------------------------------------------------------------ */

    progress.value = 0;

    const modelBytes =
      await fetchWithProgress(
        MODEL_URL,
        "SenseVoice model"
      );


    /* ------------------------------------------------------------
       6. Write model into WASM FS
       ------------------------------------------------------------ */

    writeWasmFile(
      "model.int8.onnx",
      modelBytes
    );


    /* ------------------------------------------------------------
       7. Download tokens
       ------------------------------------------------------------ */

    progress.value = 0;

    const tokenBytes =
      await fetchWithProgress(
        TOKENS_URL,
        "tokens.txt"
      );


    /* ------------------------------------------------------------
       8. Write tokens into WASM FS
       ------------------------------------------------------------ */

    writeWasmFile(
      "tokens.txt",
      tokenBytes
    );


    /* ------------------------------------------------------------
       9. Create recognizer
       ------------------------------------------------------------ */

    progressText.textContent =
      "正在建立 SenseVoice 辨識器...";

    recognizer =
      new OfflineRecognizer(
        {

          featConfig: {
            sampleRate: 16000,
            featureDim: 80
          },

          modelConfig: {

            senseVoice: {
              model:
                "./model.int8.onnx"
            },

            tokens:
              "./tokens.txt",

            numThreads: 2,

            provider: "cpu",

            debug: 0

          },

          decodingMethod:
            "greedy_search",

          maxActivePaths: 4,

          enableEndpoint: 1,

          useInverseTextNormalization: 1,

          ruleFsts: "",

          ruleFars: ""

        },
        wasmModule
      );


    logDebug(
      "OfflineRecognizer 建立完成"
    );


    runtimeStatus.textContent =
      "模型已載入";

    progress.value = 100;

    progressText.textContent =
      "SenseVoice 模型載入完成";

    micBtn.disabled = false;

    loadModelBtn.textContent =
      "模型已載入";

  } catch (error) {

    console.error(error);

    runtimeStatus.textContent =
      "載入失敗";

    progressText.textContent =
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      );

    loadModelBtn.disabled = false;

    throw error;
  }
}


/* ================================================================
   Load WASM glue JS
   ================================================================ */

function loadWasmScript() {

  return new Promise(
    (resolve, reject) => {

      if (
        document.querySelector(
          'script[data-sherpa-wasm="1"]'
        )
      ) {

        resolve();

        return;
      }


      const script =
        document.createElement("script");

      script.src =
        "./assets/sherpa-onnx-wasm-web.js";

      script.dataset.sherpaWasm =
        "1";


      script.onload =
        () => {

          logDebug(
            "sherpa-onnx-wasm-web.js 載入完成"
          );

          resolve();

        };


      script.onerror =
        () => {

          reject(
            new Error(
              "sherpa-onnx-wasm-web.js 載入失敗"
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );
}


/* ================================================================
   Linear resampling
   ================================================================ */

function resampleLinear(
  input,
  inputRate,
  outputRate
) {

  if (
    inputRate === outputRate
  ) {

    return input;

  }


  const ratio =
    inputRate / outputRate;

  const outputLength =
    Math.floor(
      input.length / ratio
    );

  const output =
    new Float32Array(
      outputLength
    );


  for (
    let i = 0;
    i < outputLength;
    i++
  ) {

    const position =
      i * ratio;

    const left =
      Math.floor(position);

    const right =
      Math.min(
        left + 1,
        input.length - 1
      );

    const frac =
      position - left;

    output[i] =
      input[left] *
      (1 - frac) +
      input[right] *
      frac;

  }

  return output;
}


/* ================================================================
   Start microphone
   ================================================================ */

async function startRecording() {

  if (!recognizer) {

    throw new Error(
      "模型尚未載入。"
    );

  }


  mediaStream =
    await navigator.mediaDevices.getUserMedia(
      {
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      }
    );


  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  await audioContext.resume();


  sourceNode =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  /*
   * ScriptProcessorNode 雖然是 deprecated，
   * 但目前 Safari / iOS 相容性仍然實用。
   */

  processorNode =
    audioContext.createScriptProcessor(
      4096,
      1,
      1
    );


  silentGain =
    audioContext.createGain();

  silentGain.gain.value =
    0;


  audioChunks = [];


  processorNode.onaudioprocess =
    function(event) {

      const input =
        event.inputBuffer.getChannelData(0);

      audioChunks.push(
        new Float32Array(input)
      );

    };


  sourceNode.connect(
    processorNode
  );

  processorNode.connect(
    silentGain
  );

  silentGain.connect(
    audioContext.destination
  );


  isRecording = true;

  micBtn.textContent =
    "⏹ 停止錄音";

  micBtn.classList.add(
    "recording"
  );

  progressText.textContent =
    "正在錄音，請說話...";

}


/* ================================================================
   Stop microphone
   ================================================================ */

async function stopRecording() {

  if (!isRecording) {
    return;
  }


  isRecording = false;


  micBtn.textContent =
    "🎤 開始錄音";

  micBtn.classList.remove(
    "recording"
  );


  if (processorNode) {

    processorNode.disconnect();

    processorNode.onaudioprocess =
      null;

  }


  if (sourceNode) {

    sourceNode.disconnect();

  }


  if (silentGain) {

    silentGain.disconnect();

  }


  if (mediaStream) {

    for (
      const track
      of mediaStream.getTracks()
    ) {

      track.stop();

    }

  }


  const chunks =
    audioChunks;

  audioChunks = [];


  let totalLength = 0;

  for (
    const chunk
    of chunks
  ) {

    totalLength +=
      chunk.length;

  }


  const samples =
    new Float32Array(
      totalLength
    );


  let offset = 0;


  for (
    const chunk
    of chunks
  ) {

    samples.set(
      chunk,
      offset
    );

    offset +=
      chunk.length;

  }


  if (
    samples.length < 1000
  ) {

    progressText.textContent =
      "錄音太短，請再試一次。";

    return;

  }


  progressText.textContent =
    "正在辨識...";


  try {

    const inputRate =
      audioContext
        ? audioContext.sampleRate
        : 48000;


    const audio16k =
      resampleLinear(
        samples,
        inputRate,
        16000
      );


    logDebug(
      `錄音 sample rate: ${inputRate} Hz`
    );

    logDebug(
      `送入辨識: ${audio16k.length} samples`
    );


    const stream =
      recognizer.createStream();


    stream.acceptWaveform(
      {
        samples:
          audio16k,

        sampleRate:
          16000
      }
    );


    if (
      typeof recognizer.decodeAsync ===
      "function"
    ) {

      await recognizer.decodeAsync(
        stream
      );

    } else {

      recognizer.decode(
        stream
      );

    }


    const result =
      recognizer.getResult(
        stream
      );


    const text =
      result &&
      typeof result.text === "string"
        ? result.text
        : "";


    if (text.trim()) {

      resultText.value +=
        (
          resultText.value
            ? "\n"
            : ""
        ) +
        text.trim();

    } else {

      progressText.textContent =
        "沒有辨識到文字，請再試一次。";

      return;

    }


    progressText.textContent =
      "辨識完成";

  } catch (error) {

    console.error(error);

    progressText.textContent =
      "辨識失敗：" +
      (
        error.message ||
        String(error)
      );

  } finally {

    if (audioContext) {

      try {
        await audioContext.close();
      } catch (_) {}

      audioContext =
        null;

    }

  }
}


/* ================================================================
   Buttons
   ================================================================ */

loadModelBtn.addEventListener(
  "click",
  async function() {

    try {

      await loadModel();

    } catch (error) {

      console.error(
        "loadModel:",
        error
      );

    }

  }
);


micBtn.addEventListener(
  "click",
  async function() {

    try {

      if (isRecording) {

        await stopRecording();

      } else {

        await startRecording();

      }

    } catch (error) {

      console.error(error);

      progressText.textContent =
        "麥克風錯誤：" +
        (
          error.message ||
          String(error)
        );

    }

  }
);


clearBtn.addEventListener(
  "click",
  function() {

    resultText.value = "";

  }
);


/* ================================================================
   Service Worker
   ================================================================ */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function(registration) {

            console.log(
              "Service Worker registered:",
              registration.scope
            );

          }
        )
        .catch(
          function(error) {

            console.warn(
              "Service Worker registration failed:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>
</html>
