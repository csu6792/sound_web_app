<script>

"use strict";


/* =====================================================
   DOM
   ===================================================== */

const $ =
  id => document.getElementById(id);

const loadButton =
  $("load");

const micButton =
  $("mic");

const clearButton =
  $("clear");

const statusElement =
  $("status");

const outputElement =
  $("out");

const progressBox =
  $("progressBox");

const progressText =
  $("progressText");

const progressPercent =
  $("progressPercent");

const progressFill =
  $("progressFill");

const debugElement =
  $("debug");


/* =====================================================
   State
   ===================================================== */

let wasmModule = null;

let recognizer = null;

let audioContext = null;

let mediaStream = null;

let mediaSource = null;

let processor = null;

let silentGain = null;

let audioStream = null;

let recording = false;

let loading = false;


/* =====================================================
   UI
   ===================================================== */

function setStatus(text) {

  statusElement.textContent = text;

}


function setProgress(percent, text) {

  percent =
    Math.max(
      0,
      Math.min(
        100,
        percent || 0
      )
    );

  progressFill.style.width =
    percent + "%";

  progressPercent.textContent =
    Math.round(percent) + "%";

  if (text !== undefined) {

    progressText.textContent =
      text;

  }

}


function debug(text) {

  console.log(text);

  debugElement.hidden = false;

  debugElement.textContent +=
    text + "\n";

}


function formatBytes(bytes) {

  if (!bytes || bytes <= 0) {

    return "0 MB";

  }

  return (
    bytes /
    1024 /
    1024
  ).toFixed(1) + " MB";

}


/* =====================================================
   Service Worker
   ===================================================== */

async function registerServiceWorker() {

  if (!("serviceWorker" in navigator)) {

    debug(
      "Service Worker 不支援"
    );

    return;

  }


  try {

    const registration =
      await navigator.serviceWorker.register(
        "./sw.js"
      );


    debug(
      "Service Worker OK: " +
      registration.scope
    );


  } catch (error) {

    debug(
      "Service Worker 失敗: " +
      error.message
    );

  }

}


/* =====================================================
   Wait for Emscripten Module
   ===================================================== */

async function waitForWasmModule() {

  /*
   * sherpa-onnx-wasm-web.js
   * 可能同步建立 Module，
   * 也可能非同步初始化。
   */

  for (
    let i = 0;
    i < 600;
    i++
  ) {

    /*
     * 可能存在：
     *
     * window.Module
     * window.SherpaOnnx
     * Module.calledRun
     */

    if (
      window.Module &&
      (
        window.Module.calledRun ||
        window.Module.FS ||
        window.Module.HEAPF32
      )
    ) {

      return window.Module;

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );

  }


  throw new Error(
    "WASM 初始化逾時"
  );

}


/* =====================================================
   Find OfflineRecognizer
   ===================================================== */

function findOfflineRecognizer() {

  /*
   * 不同 sherpa-onnx build
   * 可能把 OfflineRecognizer
   * 放在不同 namespace。
   */


  if (
    typeof window.OfflineRecognizer ===
    "function"
  ) {

    return window.OfflineRecognizer;

  }


  if (
    window.SherpaOnnx &&
    typeof
      window.SherpaOnnx.OfflineRecognizer ===
      "function"
  ) {

    return window.SherpaOnnx.OfflineRecognizer;

  }


  if (
    window.sherpa_onnx &&
    typeof
      window.sherpa_onnx.OfflineRecognizer ===
      "function"
  ) {

    return window.sherpa_onnx.OfflineRecognizer;

  }


  /*
   * 最後掃描所有 global。
   */

  const names =
    Object.keys(window);


  for (
    const name of names
  ) {

    try {

      const value =
        window[name];

      if (
        value &&
        typeof value.OfflineRecognizer ===
        "function"
      ) {

        return value.OfflineRecognizer;

      }

    } catch (_) {}

  }


  return null;

}


/* =====================================================
   Download file with progress
   ===================================================== */

async function downloadFile(
  url,
  label,
  knownSize
) {

  setStatus(
    "正在下載 " + label + "…"
  );


  setProgress(
    0,
    "連線中…"
  );


  /*
   * 直接 fetch。
   *
   * Service Worker cache 命中時，
   * 也能正常讀取 response body。
   */

  const response =
    await fetch(
      url,
      {
        cache: "default"
      }
    );


  if (!response.ok) {

    throw new Error(
      label +
      " HTTP " +
      response.status
    );

  }


  /*
   * Content-Length 不一定存在。
   */

  let total =
    Number(
      response.headers.get(
        "Content-Length"
      )
    );


  /*
   * 如果 server 沒有 Content-Length，
   * 使用我們知道的模型大小。
   */

  if (
    !Number.isFinite(total) ||
    total <= 0
  ) {

    total =
      knownSize || 0;

  }


  /*
   * ReadableStream
   */

  if (!response.body) {

    const buffer =
      new Uint8Array(
        await response.arrayBuffer()
      );


    setProgress(
      100,
      formatBytes(
        buffer.byteLength
      ) +
      (
        total
          ? " / " +
            formatBytes(total)
          : ""
      )
    );


    return buffer;

  }


  const reader =
    response.body.getReader();


  const chunks = [];

  let received = 0;


  while (true) {

    const result =
      await reader.read();


    if (result.done) {

      break;

    }


    if (result.value) {

      chunks.push(
        result.value
      );


      received +=
        result.value.byteLength;


      let percent = 0;


      if (total > 0) {

        percent =
          received /
          total *
          100;

      }


      setProgress(

        percent,

        formatBytes(
          received
        ) +
        (
          total
            ? " / " +
              formatBytes(total)
            : ""
        )

      );

    }

  }


  /*
   * 合併 chunk
   */

  const data =
    new Uint8Array(
      received
    );


  let offset = 0;


  for (
    const chunk of chunks
  ) {

    data.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;

  }


  setProgress(

    100,

    formatBytes(
      data.byteLength
    ) +
    (
      total
        ? " / " +
          formatBytes(total)
        : ""
    )

  );


  return data;

}


/* =====================================================
   Write files into Emscripten FS
   ===================================================== */

function writeModelFiles(
  modelData,
  tokensText
) {

  if (
    !wasmModule
  ) {

    throw new Error(
      "WASM Module 尚未初始化"
    );

  }


  /*
   * 優先使用 FS.writeFile。
   *
   * 這是你目前 log 已確認存在的 API。
   */

  if (
    wasmModule.FS &&
    typeof wasmModule.FS.writeFile ===
      "function"
  ) {

    debug(
      "使用 Module.FS.writeFile"
    );


    try {

      wasmModule.FS.unlink(
        "/model.int8.onnx"
      );

    } catch (_) {}


    try {

      wasmModule.FS.unlink(
        "/tokens.txt"
      );

    } catch (_) {}


    wasmModule.FS.writeFile(
      "/model.int8.onnx",
      modelData
    );


    wasmModule.FS.writeFile(
      "/tokens.txt",
      tokensText
    );


    return;

  }


  /*
   * 第二種可能：
   * globalThis.FS
   */

  if (
    window.FS &&
    typeof window.FS.writeFile ===
      "function"
  ) {

    debug(
      "使用 global FS.writeFile"
    );


    try {

      window.FS.unlink(
        "/model.int8.onnx"
      );

    } catch (_) {}


    try {

      window.FS.unlink(
        "/tokens.txt"
      );

    } catch (_) {}


    window.FS.writeFile(
      "/model.int8.onnx",
      modelData
    );


    window.FS.writeFile(
      "/tokens.txt",
      tokensText
    );


    return;

  }


  throw new Error(
    "WebAssembly 沒有提供 Emscripten FS。"
  );

}


/* =====================================================
   Create recognizer
   ===================================================== */

function createRecognizer() {

  /*
   * 找 API。
   */

  const OfflineRecognizer =
    findOfflineRecognizer();


  if (!OfflineRecognizer) {

    /*
     * 顯示實際 global，
     * 方便 debug。
     */

    const globals =
      Object.keys(window)
        .filter(
          name =>
            name
              .toLowerCase()
              .includes(
                "sherpa"
              )
        )
        .join(", ");


    throw new Error(
      "找不到 OfflineRecognizer。" +
      "\n目前 sherpa globals：" +
      globals
    );

  }


  debug(
    "找到 OfflineRecognizer"
  );


  /*
   * SenseVoice config
   *
   * sherpa-onnx 的 JS API
   * 使用這個 config 結構。
   */

  const config = {

    featConfig: {

      sampleRate: 16000,

      featureDim: 80

    },


    modelConfig: {

      tokens:
        "./tokens.txt",

      numThreads:
        2,

      provider:
        "cpu",

      debug:
        0,

      modelType:
        "",

      modelingUnit:
        "cjkchar",

      bpeVocab:
        "",

      senseVoice: {

        model:
          "./model.int8.onnx",

        language:
          "zh",

        useInverseTextNormalization:
          1

      }

    },


    decodingMethod:
      "greedy_search"

  };


  /*
   * 舊版 sherpa-onnx browser API
   */

  try {

    return new OfflineRecognizer(
      config,
      wasmModule
    );

  } catch (error) {

    debug(
      "OfflineRecognizer 建立失敗：" +
      error.message
    );


    /*
     * 某些新版 wrapper
     * 可能使用 config-only constructor。
     */

    try {

      return new OfflineRecognizer(
        config
      );

    } catch (_) {

      throw error;

    }

  }

}


/* =====================================================
   Load model
   ===================================================== */

async function loadModel() {

  if (
    loading ||
    recognizer
  ) {

    return;

  }


  loading = true;

  loadButton.disabled = true;

  micButton.disabled = true;

  progressBox.hidden = false;


  try {

    /*
     * --------------------------------------------------
     * 1. WASM
     * --------------------------------------------------
     */

    setProgress(
      0,
      "正在初始化 WebAssembly…"
    );

    setStatus(
      "正在初始化 WebAssembly…"
    );


    wasmModule =
      await waitForWasmModule();


    debug(
      "Emscripten Module 初始化完成"
    );


    if (
      wasmModule.FS &&
      typeof wasmModule.FS.writeFile ===
        "function"
    ) {

      debug(
        "OK：wasmModule.FS.writeFile"
      );

    }


    /*
     * --------------------------------------------------
     * 2. model
     * --------------------------------------------------
     */

    const MODEL_SIZE =
      227 * 1024 * 1024;


    setProgress(
      0,
      "準備下載 SenseVoice 模型…"
    );


    const modelData =
      await downloadFile(

        "./assets/model.int8.onnx",

        "SenseVoice INT8",

        MODEL_SIZE

      );


    /*
     * --------------------------------------------------
     * 3. tokens
     * --------------------------------------------------
     */

    setStatus(
      "正在載入 tokens.txt…"
    );


    setProgress(
      100,
      "模型下載完成"
    );


    const tokensResponse =
      await fetch(
        "./assets/tokens.txt"
      );


    if (!tokensResponse.ok) {

      throw new Error(
        "tokens.txt HTTP " +
        tokensResponse.status
      );

    }


    const tokensText =
      await tokensResponse.text();


    /*
     * --------------------------------------------------
     * 4. Write FS
     * --------------------------------------------------
     */

    setStatus(
      "正在準備模型檔案…"
    );


    setProgress(
      100,
      "正在寫入 WebAssembly 檔案系統…"
    );


    /*
     * 讓瀏覽器有機會更新 UI。
     */

    await new Promise(
      requestAnimationFrame
    );


    writeModelFiles(
      modelData,
      tokensText
    );


    /*
     * --------------------------------------------------
     * 5. Recognizer
     * --------------------------------------------------
     */

    setStatus(
      "正在建立 SenseVoice 辨識器…"
    );


    setProgress(
      100,
      "初始化 SenseVoice…"
    );


    await new Promise(
      requestAnimationFrame
    );


    recognizer =
      createRecognizer();


    if (!recognizer) {

      throw new Error(
        "SenseVoice 辨識器建立失敗"
      );

    }


    /*
     * --------------------------------------------------
     * 6. Ready
     * --------------------------------------------------
     */

    micButton.disabled =
      false;


    setProgress(
      100,
      "模型已準備完成"
    );


    progressPercent.textContent =
      "完成";


    setStatus(
      "✅ 模型已載入，可以開始說話。"
    );


    debug(
      "SenseVoice ready"
    );


  } catch (error) {

    console.error(
      error
    );


    debug(
      "ERROR: " +
      (
        error &&
        error.stack
          ? error.stack
          : error
      )
    );


    recognizer =
      null;


    micButton.disabled =
      true;


    loadButton.disabled =
      false;


    setProgress(
      0,
      "載入失敗"
    );


    setStatus(
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    loading =
      false;

  }

}


/* =====================================================
   Resample
   ===================================================== */

function resampleTo16k(
  input,
  inputRate
) {

  if (
    inputRate === 16000
  ) {

    return new Float32Array(
      input
    );

  }


  const ratio =
    inputRate / 16000;


  const outputLength =
    Math.floor(
      input.length / ratio
    );


  const output =
    new Float32Array(
      outputLength
    );


  /*
   * Linear interpolation。
   *
   * 對語音辨識來說已足夠，
   * 且比建立 OfflineAudioContext
   * 更容易控制 iPhone 記憶體。
   */

  for (
    let i = 0;
    i < outputLength;
    i++
  ) {

    const position =
      i * ratio;

    const index =
      Math.floor(position);

    const fraction =
      position - index;


    const a =
      input[index] || 0;

    const b =
      input[index + 1] || a;


    output[i] =
      a +
      (
        b - a
      ) *
      fraction;

  }


  return output;

}


/* =====================================================
   Start recording
   ===================================================== */

async function startRecording() {

  if (!recognizer) {

    setStatus(
      "請先載入模型。"
    );

    return;

  }


  if (recording) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "目前瀏覽器不支援麥克風。"
    );

    return;

  }


  try {

    /*
     * microphone
     */

    mediaStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          channelCount: 1,

          echoCancellation:
            false,

          noiseSuppression:
            false,

          autoGainControl:
            false

        }

      });


    /*
     * AudioContext
     */

    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    const inputRate =
      audioContext.sampleRate;


    debug(
      "AudioContext sample rate: " +
      inputRate
    );


    /*
     * source
     */

    mediaSource =
      audioContext
        .createMediaStreamSource(
          mediaStream
        );


    /*
     * Offline stream
     */

    audioStream =
      recognizer.createStream();


    /*
     * ScriptProcessor
     */

    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processor.onaudioprocess =
      event => {

        if (
          !audioStream ||
          !recording
        ) {

          return;

        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          resampleTo16k(
            input,
            inputRate
          );


        audioStream.acceptWaveform(
          16000,
          samples
        );

      };


    /*
     * Audio graph
     */

    mediaSource.connect(
      processor
    );


    /*
     * silent output
     */

    silentGain =
      audioContext.createGain();


    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    /*
     * state
     */

    recording =
      true;


    micButton.textContent =
      "⏹ 停止";


    micButton.classList.add(
      "stop"
    );


    setStatus(
      "🔴 錄音中…說完後按「停止」。"
    );


    debug(
      "Recording started"
    );


  } catch (error) {

    console.error(
      error
    );


    cleanupAudio();


    setStatus(
      "麥克風錯誤：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }

}


/* =====================================================
   Stop recording
   ===================================================== */

async function stopRecording() {

  if (!recording) {

    return;

  }


  recording =
    false;


  micButton.disabled =
    true;


  setStatus(
    "錄音完成，正在辨識…"
  );


  try {

    /*
     * stop callback
     */

    if (processor) {

      processor.onaudioprocess =
        null;

    }


    /*
     * stop microphone
     */

    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    /*
     * close AudioContext
     */

    if (audioContext) {

      try {

        await audioContext.close();

      } catch (_) {}

    }


    /*
     * Decode
     *
     * 使用 setTimeout 把 decode
     * 放到下一個 event loop。
     */

    if (!audioStream) {

      throw new Error(
        "沒有音訊資料"
      );

    }


    setProgress(
      100,
      "正在進行 SenseVoice 辨識…"
    );


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          30
        )
    );


    recognizer.decode(
      audioStream
    );


    const result =
      recognizer.getResult(
        audioStream
      );


    debug(
      "Recognition result: " +
      JSON.stringify(
        result
      )
    );


    if (
      result &&
      result.text
    ) {

      outputElement.value =
        result.text;


      setStatus(
        "✅ 完成。"
      );


    } else {

      setStatus(
        "沒有辨識到文字。"
      );

    }


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      "辨識失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    if (audioStream) {

      try {

        audioStream.free();

      } catch (_) {}

    }


    cleanupAudio();


    micButton.disabled =
      false;


    micButton.textContent =
      "② 開始說話";


    micButton.classList.remove(
      "stop"
    );

  }

}


/* =====================================================
   Cleanup
   ===================================================== */

function cleanupAudio() {

  if (processor) {

    try {

      processor.disconnect();

    } catch (_) {}

  }


  if (mediaSource) {

    try {

      mediaSource.disconnect();

    } catch (_) {}

  }


  if (silentGain) {

    try {

      silentGain.disconnect();

    } catch (_) {}

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track => {

          try {

            track.stop();

          } catch (_) {}

        }
      );

  }


  processor =
    null;

  mediaSource =
    null;

  silentGain =
    null;

  mediaStream =
    null;

  audioContext =
    null;

  audioStream =
    null;

}


/* =====================================================
   Buttons
   ===================================================== */

loadButton.addEventListener(
  "click",
  loadModel
);


micButton.addEventListener(
  "click",
  async () => {

    if (recording) {

      await stopRecording();

    } else {

      await startRecording();

    }

  }
);


clearButton.addEventListener(
  "click",
  () => {

    outputElement.value =
      "";


    setStatus(

      recognizer

        ? "模型已載入，可以開始說話。"

        : "等待載入模型。"

    );

  }
);


/* =====================================================
   Startup
   ===================================================== */

registerServiceWorker();

</script>
