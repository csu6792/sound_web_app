<script>

"use strict";


/* ================================================================
   URLs
   ================================================================ */

const MODEL_URL =
  "https://huggingface.co/csukuangfj/" +
  "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/" +
  "resolve/main/model.int8.onnx";

const TOKENS_URL =
  "https://huggingface.co/csukuangfj/" +
  "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/" +
  "resolve/main/tokens.txt";


/* ================================================================
   Cache
   ================================================================ */

const MODEL_CACHE_NAME =
  "sensevoice-model-v1";


/* ================================================================
   DOM
   ================================================================ */

const loadModelBtn =
  document.getElementById(
    "loadModelBtn"
  );

const micBtn =
  document.getElementById(
    "micBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const progress =
  document.getElementById(
    "progress"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const resultText =
  document.getElementById(
    "result"
  );

const runtimeStatus =
  document.getElementById(
    "runtimeStatus"
  );

const debug =
  document.getElementById(
    "debug"
  );


/* ================================================================
   Runtime
   ================================================================ */

let wasmModule = null;

let sherpa_onnx = null;

let recognizer = null;


/* ================================================================
   Audio
   ================================================================ */

let audioContext = null;

let mediaStream = null;

let sourceNode = null;

let processorNode = null;

let silentGain = null;

let audioChunks = [];

let isRecording = false;


/* ================================================================
   Debug
   ================================================================ */

function logDebug(message) {

  console.log(
    "[SenseVoice]",
    message
  );

  debug.textContent +=
    (
      debug.textContent
        ? "\n"
        : ""
    ) +
    message;

}


/* ================================================================
   MB
   ================================================================ */

function formatMB(bytes) {

  return (
    bytes / 1024 / 1024
  ).toFixed(1) +
  " MB";

}


/* ================================================================
   Load external script
   ================================================================ */

function loadScript(
  src,
  attributes = {}
) {

  return new Promise(
    (resolve, reject) => {

      const existing =
        document.querySelector(
          `script[src="${src}"]`
        );

      if (existing) {

        if (
          existing.dataset.loaded === "1"
        ) {

          resolve();

          return;

        }

      }


      const script =
        document.createElement(
          "script"
        );


      script.src = src;


      for (
        const [key, value]
        of Object.entries(attributes)
      ) {

        script.setAttribute(
          key,
          value
        );

      }


      script.onload =
        () => {

          script.dataset.loaded =
            "1";

          resolve();

        };


      script.onerror =
        () => {

          reject(
            new Error(
              `JavaScript 載入失敗：${src}`
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* ================================================================
   Load WASM runtime
   ================================================================ */

async function loadWasmRuntime() {

  runtimeStatus.textContent =
    "載入 WebAssembly...";

  logDebug(
    "載入 sherpa-onnx-wasm-web.js"
  );


  /*
   * IMPORTANT:
   *
   * sherpa-onnx WebAssembly 是 Emscripten
   * modularized build。
   *
   * 這裡讓 Emscripten factory 使用
   * window.Module 作為設定物件。
   */

  window.Module = {

    locateFile(path) {

      return (
        "./assets/" +
        path
      );

    },

    print(text) {

      console.log(
        "[WASM]",
        text
      );

    },

    printErr(text) {

      console.error(
        "[WASM]",
        text
      );

    }

  };


  await loadScript(
    "./assets/sherpa-onnx-wasm-web.js"
  );


  /*
   * Emscripten modularized runtime
   *
   * 某些版本會建立：
   *
   * Module()
   *
   * 某些 sherpa-onnx build 則使用
   * EXPORT_NAME。
   */

  let factory = null;


  if (
    typeof window.SherpaOnnx ===
    "function"
  ) {

    factory =
      window.SherpaOnnx;

    logDebug(
      "找到 window.SherpaOnnx factory"
    );

  } else if (
    typeof window.Module ===
    "function"
  ) {

    factory =
      window.Module;

    logDebug(
      "找到 window.Module factory"
    );

  } else if (
    typeof window.SherpaOnnxModule ===
    "function"
  ) {

    factory =
      window.SherpaOnnxModule;

    logDebug(
      "找到 window.SherpaOnnxModule factory"
    );

  }


  if (!factory) {

    /*
     * 如果 build 沒有 MODULARIZE，
     * Module 可能已經是 instance。
     */

    if (
      window.Module &&
      typeof window.Module ===
      "object"
    ) {

      wasmModule =
        window.Module;

      logDebug(
        "使用既有 Module instance"
      );

    } else {

      throw new Error(
        "找不到 Emscripten Module factory。"
      );

    }

  } else {

    wasmModule =
      await factory(
        window.Module
      );

  }


  if (!wasmModule) {

    throw new Error(
      "Emscripten Module 初始化失敗。"
    );

  }


  runtimeStatus.textContent =
    "WebAssembly 已初始化";


  logDebug(
    "Emscripten Module 初始化完成"
  );


  /*
   * Verify FS
   */

  if (
    wasmModule.FS &&
    typeof wasmModule.FS.writeFile ===
      "function"
  ) {

    logDebug(
      "OK：wasmModule.FS.writeFile"
    );

  } else {

    throw new Error(
      "WebAssembly 已初始化，但 FS.writeFile 不存在。"
    );

  }

}


/* ================================================================
   Load sherpa-onnx JS API
   ================================================================ */

async function loadSherpaApi() {

  logDebug(
    "載入 sherpa-onnx-asr.js"
  );


  /*
   * 先載入官方 wrapper。
   */

  await loadScript(
    "./assets/sherpa-onnx-asr.js"
  );


  /*
   * sherpa-onnx-asr.js 可能建立：
   *
   * window.sherpa_onnx
   *
   * 而不是：
   *
   * window.OfflineRecognizer
   */

  if (
    window.sherpa_onnx &&
    typeof
      window.sherpa_onnx.OfflineRecognizer ===
      "function"
  ) {

    sherpa_onnx =
      window.sherpa_onnx;

    logDebug(
      "OK：sherpa_onnx.OfflineRecognizer"
    );

    return;

  }


  /*
   * 某些版本可能直接建立
   * window.sherpaOnnx。
   */

  if (
    window.sherpaOnnx &&
    typeof
      window.sherpaOnnx.OfflineRecognizer ===
      "function"
  ) {

    sherpa_onnx =
      window.sherpaOnnx;

    logDebug(
      "OK：sherpaOnnx.OfflineRecognizer"
    );

    return;

  }


  /*
   * Debug：把 global keys 印出來。
   */

  const possible =
    Object.keys(window)
      .filter(
        key =>
          key
            .toLowerCase()
            .includes("sherpa")
      );


  logDebug(
    "找到的 sherpa 全域名稱：" +
    (
      possible.length
        ? possible.join(", ")
        : "無"
    )
  );


  throw new Error(
    "sherpa-onnx-asr.js 載入成功，但找不到 sherpa_onnx.OfflineRecognizer。"
  );

}


/* ================================================================
   Download with progress
   ================================================================ */

async function fetchWithProgress(
  url,
  label
) {

  const response =
    await fetch(
      url,
      {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        cache: "default"
      }
    );


  if (!response.ok) {

    throw new Error(
      `${label} HTTP ${response.status}`
    );

  }


  const contentLength =
    Number(
      response.headers.get(
        "content-length"
      )
    ) || 0;


  /*
   * Cache response
   */

  const responseForCache =
    response.clone();


  /*
   * 不阻塞下載。
   *
   * cache 失敗也不影響模型載入。
   */

  caches
    .open(
      MODEL_CACHE_NAME
    )
    .then(
      cache =>
        cache.put(
          url,
          responseForCache
        )
    )
    .catch(
      error =>
        console.warn(
          "Cache write failed:",
          error
        )
    );


  if (!response.body) {

    const buffer =
      await response.arrayBuffer();

    progress.value = 100;

    progressText.textContent =
      `${label}: ` +
      `${formatMB(buffer.byteLength)}`;

    return new Uint8Array(
      buffer
    );

  }


  const reader =
    response.body.getReader();


  const chunks = [];

  let received = 0;


  while (true) {

    const {
      done,
      value
    } =
      await reader.read();


    if (done) {

      break;

    }


    if (!value) {

      continue;

    }


    chunks.push(
      value
    );


    received +=
      value.byteLength;


    if (
      contentLength > 0
    ) {

      const percent =
        received /
        contentLength *
        100;


      progress.value =
        percent;


      progressText.textContent =
        `${label}: ` +
        `${percent.toFixed(1)}% ` +
        `(${formatMB(received)} / ` +
        `${formatMB(contentLength)})`;

    } else {

      progressText.textContent =
        `${label}: ` +
        `${formatMB(received)}`;

    }

  }


  const output =
    new Uint8Array(
      received
    );


  let offset = 0;


  for (
    const chunk
    of chunks
  ) {

    output.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;

  }


  progress.value =
    100;


  progressText.textContent =
    `${label}: ` +
    `${formatMB(received)}`;


  return output;

}


/* ================================================================
   Get cached model
   ================================================================ */

async function getCachedModel() {

  if (
    !("caches" in window)
  ) {

    return null;

  }


  try {

    const cache =
      await caches.open(
        MODEL_CACHE_NAME
      );


    const response =
      await cache.match(
        MODEL_URL
      );


    if (!response) {

      return null;

    }


    logDebug(
      "從 Cache Storage 取得模型"
    );


    const bytes =
      new Uint8Array(
        await response.arrayBuffer()
      );


    progress.value =
      100;


    progressText.textContent =
      `模型已從快取載入：` +
      `${formatMB(bytes.byteLength)}`;


    return bytes;

  } catch (error) {

    console.warn(
      "Cache read failed:",
      error
    );

    return null;

  }

}


/* ================================================================
   Write into WASM FS
   ================================================================ */

function writeWasmFile(
  filename,
  data
) {

  if (
    !wasmModule ||
    !wasmModule.FS ||
    typeof wasmModule.FS.writeFile !==
      "function"
  ) {

    throw new Error(
      "Emscripten FS.writeFile 不存在。"
    );

  }


  logDebug(
    `寫入 WASM FS：/${filename} ` +
    `(${formatMB(data.byteLength)})`
  );


  wasmModule.FS.writeFile(
    "/" + filename,
    data
  );


  logDebug(
    `完成：/${filename}`
  );

}


/* ================================================================
   Create recognizer
   ================================================================ */

async function createRecognizer() {

  progressText.textContent =
    "建立 SenseVoice 辨識器...";


  /*
   * 官方 API：
   *
   * new sherpa_onnx.OfflineRecognizer(
   *   config,
   *   wasmModule
   * )
   */

  recognizer =
    new sherpa_onnx.OfflineRecognizer(
      {

        featConfig: {
          sampleRate: 16000,
          featureDim: 80
        },

        modelConfig: {

          senseVoice: {
            model:
              "/model.int8.onnx"
          },

          tokens:
            "/tokens.txt",

          numThreads:
            2,

          provider:
            "cpu",

          debug:
            0

        },

        decodingMethod:
          "greedy_search",

        maxActivePaths:
          4,

        useInverseTextNormalization:
          1,

        ruleFsts:
          "",

        ruleFars:
          ""

      },

      wasmModule
    );


  if (!recognizer) {

    throw new Error(
      "OfflineRecognizer 建立失敗。"
    );

  }


  logDebug(
    "SenseVoice OfflineRecognizer 建立完成"
  );

}


/* ================================================================
   Load everything
   ================================================================ */

async function loadModel() {

  loadModelBtn.disabled =
    true;

  micBtn.disabled =
    true;

  progress.value =
    0;

  debug.textContent =
    "";


  try {

    /* ------------------------------------------------------------
       1. WASM
       ------------------------------------------------------------ */

    await loadWasmRuntime();


    /* ------------------------------------------------------------
       2. sherpa JS API
       ------------------------------------------------------------ */

    await loadSherpaApi();


    /* ------------------------------------------------------------
       3. Model
       ------------------------------------------------------------ */

    let modelBytes =
      await getCachedModel();


    if (!modelBytes) {

      progress.value =
        0;

      modelBytes =
        await fetchWithProgress(
          MODEL_URL,
          "SenseVoice model"
        );

    }


    /* ------------------------------------------------------------
       4. Model -> WASM FS
       ------------------------------------------------------------ */

    writeWasmFile(
      "model.int8.onnx",
      modelBytes
    );


    /* ------------------------------------------------------------
       5. Tokens
       ------------------------------------------------------------ */

    progress.value =
      0;


    const tokenBytes =
      await fetchWithProgress(
        TOKENS_URL,
        "tokens.txt"
      );


    writeWasmFile(
      "tokens.txt",
      tokenBytes
    );


    /* ------------------------------------------------------------
       6. Recognizer
       ------------------------------------------------------------ */

    await createRecognizer();


    runtimeStatus.textContent =
      "模型已載入";


    progress.value =
      100;


    progressText.textContent =
      "SenseVoice 模型載入完成";


    loadModelBtn.textContent =
      "模型已載入";


    micBtn.disabled =
      false;


  } catch (error) {

    console.error(
      "SenseVoice load failed:",
      error
    );


    runtimeStatus.textContent =
      "載入失敗";


    progressText.textContent =
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      );


    loadModelBtn.disabled =
      false;


    throw error;

  }

}


/* ================================================================
   Resample
   ================================================================ */

function resampleLinear(
  input,
  inputRate,
  outputRate
) {

  if (
    inputRate === outputRate
  ) {

    return input;

  }


  const ratio =
    inputRate /
    outputRate;


  const outputLength =
    Math.floor(
      input.length /
      ratio
    );


  const output =
    new Float32Array(
      outputLength
    );


  for (
    let i = 0;
    i < outputLength;
    i++
  ) {

    const position =
      i * ratio;


    const left =
      Math.floor(
        position
      );


    const right =
      Math.min(
        left + 1,
        input.length - 1
      );


    const frac =
      position -
      left;


    output[i] =
      input[left] *
        (1 - frac) +
      input[right] *
        frac;

  }


  return output;

}


/* ================================================================
   Start recording
   ================================================================ */

async function startRecording() {

  if (!recognizer) {

    throw new Error(
      "模型尚未載入。"
    );

  }


  mediaStream =
    await navigator.mediaDevices.getUserMedia(
      {
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      }
    );


  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  await audioContext.resume();


  sourceNode =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  processorNode =
    audioContext.createScriptProcessor(
      4096,
      1,
      1
    );


  silentGain =
    audioContext.createGain();


  silentGain.gain.value =
    0;


  audioChunks = [];


  processorNode.onaudioprocess =
    event => {

      const input =
        event.inputBuffer
          .getChannelData(0);


      audioChunks.push(
        new Float32Array(
          input
        )
      );

    };


  sourceNode.connect(
    processorNode
  );


  processorNode.connect(
    silentGain
  );


  silentGain.connect(
    audioContext.destination
  );


  isRecording =
    true;


  micBtn.textContent =
    "⏹ 停止錄音";


  micBtn.classList.add(
    "recording"
  );


  progressText.textContent =
    "正在錄音，請說話...";

}


/* ================================================================
   Stop recording
   ================================================================ */

async function stopRecording() {

  if (!isRecording) {

    return;

  }


  isRecording =
    false;


  micBtn.textContent =
    "🎤 開始錄音";


  micBtn.classList.remove(
    "recording"
  );


  if (processorNode) {

    processorNode.disconnect();

    processorNode.onaudioprocess =
      null;

  }


  if (sourceNode) {

    sourceNode.disconnect();

  }


  if (silentGain) {

    silentGain.disconnect();

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  const chunks =
    audioChunks;


  audioChunks =
    [];


  let totalLength =
    0;


  for (
    const chunk
    of chunks
  ) {

    totalLength +=
      chunk.length;

  }


  const samples =
    new Float32Array(
      totalLength
    );


  let offset =
    0;


  for (
    const chunk
    of chunks
  ) {

    samples.set(
      chunk,
      offset
    );


    offset +=
      chunk.length;

  }


  if (
    samples.length < 1000
  ) {

    progressText.textContent =
      "錄音太短，請再試一次。";

    return;

  }


  progressText.textContent =
    "正在辨識...";


  try {

    const inputRate =
      audioContext
        ? audioContext.sampleRate
        : 48000;


    const audio16k =
      resampleLinear(
        samples,
        inputRate,
        16000
      );


    logDebug(
      `輸入 sample rate：${inputRate} Hz`
    );


    logDebug(
      `16k samples：${audio16k.length}`
    );


    const stream =
      recognizer.createStream();


    stream.acceptWaveform(
      {
        samples:
          audio16k,

        sampleRate:
          16000
      }
    );


    if (
      typeof recognizer.decodeAsync ===
      "function"
    ) {

      await recognizer.decodeAsync(
        stream
      );

    } else {

      recognizer.decode(
        stream
      );

    }


    const result =
      recognizer.getResult(
        stream
      );


    const text =
      result &&
      typeof result.text ===
        "string"
        ? result.text
        : "";


    if (
      text.trim()
    ) {

      resultText.value +=
        (
          resultText.value
            ? "\n"
            : ""
        ) +
        text.trim();


      progressText.textContent =
        "辨識完成";

    } else {

      progressText.textContent =
        "沒有辨識到文字，請再試一次。";

    }


  } catch (error) {

    console.error(
      "Recognition failed:",
      error
    );


    progressText.textContent =
      "辨識失敗：" +
      (
        error.message ||
        String(error)
      );

  }


  if (audioContext) {

    try {

      await audioContext.close();

    } catch (_) {}

    audioContext =
      null;

  }

}


/* ================================================================
   Events
   ================================================================ */

loadModelBtn.addEventListener(
  "click",
  async () => {

    try {

      await loadModel();

    } catch (error) {

      console.error(
        error
      );

    }

  }
);


micBtn.addEventListener(
  "click",
  async () => {

    try {

      if (isRecording) {

        await stopRecording();

      } else {

        await startRecording();

      }

    } catch (error) {

      console.error(
        error
      );

      progressText.textContent =
        "麥克風錯誤：" +
        (
          error.message ||
          String(error)
        );

    }

  }
);


clearBtn.addEventListener(
  "click",
  () => {

    resultText.value =
      "";

  }
);


/* ================================================================
   Service Worker
   ================================================================ */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )
        .then(
          registration => {

            console.log(
              "Service Worker registered:",
              registration.scope
            );

          }
        )
        .catch(
          error => {

            console.warn(
              "Service Worker registration failed:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>
</html>
