<script>

/* =========================================================
   Hugging Face
   ========================================================= */

const MODEL_URL =
"https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/model.int8.onnx";

const TOKENS_URL =
"https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/tokens.txt";


/* =========================================================
   Emscripten Module
   ========================================================= */

let wasmModule = null;

var Module = {

  locateFile: function(path) {

    return "./assets/" + path;

  },

  onRuntimeInitialized: function() {

    console.log(
      "Emscripten runtime initialized"
    );

  }

};

</script>


<!-- =====================================================
     sherpa-onnx WASM
     ===================================================== -->

<script src="./assets/sherpa-onnx-wasm-web.js"></script>


<!-- =====================================================
     sherpa-onnx API
     ===================================================== -->

<script src="./assets/sherpa-onnx-asr.js"></script>


<script>

"use strict";


/* =========================================================
   DOM
   ========================================================= */

const $ =
  id => document.getElementById(id);

const loadButton =
  $("load");

const micButton =
  $("mic");

const clearButton =
  $("clear");

const statusElement =
  $("status");

const outputElement =
  $("out");

const progressBox =
  $("progressBox");

const progressText =
  $("progressText");

const progressPercent =
  $("progressPercent");

const progressFill =
  $("progressFill");

const debugElement =
  $("debug");


/* =========================================================
   State
   ========================================================= */

let recognizer = null;

let audioContext = null;

let mediaStream = null;

let mediaSource = null;

let processor = null;

let silentGain = null;

let audioStream = null;

let recording = false;

let loading = false;


/* =========================================================
   UI
   ========================================================= */

function status(message) {

  statusElement.textContent =
    message;

}


function debug(message) {

  console.log(message);

  debugElement.textContent +=
    message + "\n";

}


function progress(
  percent,
  text
) {

  percent =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  progressFill.style.width =
    percent + "%";

  progressPercent.textContent =
    Math.round(percent) + "%";

  if (
    text !== undefined
  ) {

    progressText.textContent =
      text;

  }

}


/* =========================================================
   Bytes
   ========================================================= */

function bytes(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes <= 0
  ) {

    return "0 MB";

  }

  if (
    bytes < 1024
  ) {

    return bytes + " B";

  }

  if (
    bytes < 1024 * 1024
  ) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / 1024 / 1024).toFixed(1) +
    " MB"
  );

}


/* =========================================================
   Wait for WASM
   ========================================================= */

async function waitForWasm() {

  const start =
    Date.now();

  const timeout =
    30000;


  while (
    Date.now() - start <
    timeout
  ) {

    /*
     * 優先使用 SherpaOnnx factory
     */

    if (
      typeof window.SherpaOnnx ===
      "function"
    ) {

      debug(
        "找到 window.SherpaOnnx factory"
      );

      try {

        const candidate =
          window.SherpaOnnx();


        if (
          candidate &&
          candidate.FS &&
          typeof candidate.FS.writeFile ===
            "function"
        ) {

          wasmModule =
            candidate;

          debug(
            "OK：SherpaOnnx.FS.writeFile"
          );

          return wasmModule;

        }

      } catch (e) {

        debug(
          "SherpaOnnx factory 尚未完成：" +
          e.message
        );

      }

    }


    /*
     * 某些 build 直接把 Module
     * 當成 Emscripten runtime
     */

    if (
      window.Module &&
      Module.FS &&
      typeof Module.FS.writeFile ===
        "function"
    ) {

      wasmModule =
        Module;

      debug(
        "OK：Module.FS.writeFile"
      );

      return wasmModule;

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );

  }


  throw new Error(
    "WASM 初始化逾時。\n" +
    "找不到可用的 FS.writeFile。"
  );

}


/* =========================================================
   Download with progress
   ========================================================= */

async function download(
  url,
  label
) {

  debug(
    "開始下載：" + label
  );


  const response =
    await fetch(
      url,
      {
        cache: "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      label +
      "下載失敗：" +
      response.status +
      " " +
      response.statusText
    );

  }


  const totalHeader =
    response.headers.get(
      "Content-Length"
    );

  const total =
    totalHeader
      ? parseInt(
          totalHeader,
          10
        )
      : 0;


  /*
   * 如果瀏覽器拿不到 Content-Length，
   * 仍然會顯示已下載 MB。
   */

  if (
    !response.body
  ) {

    const buffer =
      await response.arrayBuffer();

    progress(
      100,
      label +
      " " +
      bytes(
        buffer.byteLength
      )
    );

    return new Uint8Array(
      buffer
    );

  }


  const reader =
    response.body.getReader();


  const chunks = [];

  let received = 0;


  while (true) {

    const result =
      await reader.read();


    if (
      result.done
    ) {

      break;

    }


    const value =
      result.value;


    if (!value) {
      continue;
    }


    chunks.push(
      value
    );


    received +=
      value.byteLength;


    if (
      total > 0
    ) {

      const percent =
        received /
        total *
        100;


      progress(
        percent,
        label +
        "  " +
        bytes(received) +
        " / " +
        bytes(total)
      );


      status(
        "正在下載 " +
        label +
        "… " +
        Math.round(
          percent
        ) +
        "%"
      );

    } else {

      /*
       * Hugging Face CDN 有時不提供
       * Content-Length。
       */

      progress(
        0,
        label +
        "  " +
        bytes(received)
      );


      progressPercent.textContent =
        bytes(received);


      status(
        "正在下載 " +
        label +
        "… " +
        bytes(received)
      );

    }

  }


  const data =
    new Uint8Array(
      received
    );


  let offset = 0;


  for (
    const chunk of chunks
  ) {

    data.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;

  }


  if (
    total > 0
  ) {

    progress(
      100,
      label +
      " " +
      bytes(received) +
      " / " +
      bytes(total)
    );

  } else {

    progress(
      100,
      label +
      " " +
      bytes(received)
    );

  }


  debug(
    label +
    " 完成：" +
    bytes(received)
  );


  return data;

}


/* =========================================================
   Load model
   ========================================================= */

async function loadModel() {

  if (
    loading ||
    recognizer
  ) {

    return;

  }


  loading =
    true;


  loadButton.disabled =
    true;

  micButton.disabled =
    true;


  progressBox.hidden =
    false;


  progress(
    0,
    "準備下載模型…"
  );


  status(
    "正在連線到 Hugging Face…"
  );


  try {

    /* -----------------------------------------------------
       WASM
       --------------------------------------------------- */

    status(
      "正在初始化 WebAssembly…"
    );


    await waitForWasm();


    debug(
      "WASM Module 初始化完成"
    );


    /* -----------------------------------------------------
       Model
       --------------------------------------------------- */

    status(
      "正在下載 SenseVoice INT8 模型…"
    );


    const modelData =
      await download(
        MODEL_URL,
        "SenseVoice 模型"
      );


    /* -----------------------------------------------------
       Tokens
       --------------------------------------------------- */

    progress(
      100,
      "模型下載完成"
    );


    status(
      "正在下載 tokens.txt…"
    );


    const tokensData =
      await download(
        TOKENS_URL,
        "tokens.txt"
      );


    const tokensText =
      new TextDecoder(
        "utf-8"
      ).decode(
        tokensData
      );


    /* -----------------------------------------------------
       FS
       --------------------------------------------------- */

    status(
      "正在寫入 WASM 檔案系統…"
    );


    if (
      !wasmModule ||
      !wasmModule.FS ||
      typeof wasmModule.FS.writeFile !==
        "function"
    ) {

      throw new Error(
        "WebAssembly 沒有提供 Emscripten FS.writeFile"
      );

    }


    /*
     * 清除舊檔案
     */

    try {

      wasmModule.FS.unlink(
        "/model.int8.onnx"
      );

    } catch (_) {}


    try {

      wasmModule.FS.unlink(
        "/tokens.txt"
      );

    } catch (_) {}


    /*
     * 寫入模型
     */

    wasmModule.FS.writeFile(
      "/model.int8.onnx",
      modelData
    );


    wasmModule.FS.writeFile(
      "/tokens.txt",
      tokensText
    );


    debug(
      "OK：model.int8.onnx 已寫入 WASM FS"
    );


    debug(
      "OK：tokens.txt 已寫入 WASM FS"
    );


    /* -----------------------------------------------------
       Check sherpa API
       --------------------------------------------------- */

    status(
      "正在載入 sherpa-onnx API…"
    );


    debug(
      "Sherpa globals:"
    );


    debug(
      Object.keys(
        window
      )
      .filter(
        key =>
          key
            .toLowerCase()
            .includes("sherpa")
      )
      .join(", ")
    );


    /*
     * 新版 API
     */

    if (
      typeof window.SherpaOnnx ===
      "function"
    ) {

      debug(
        "SherpaOnnx API 存在"
      );

    }


    /*
     * 舊版 API fallback
     */

    if (
      typeof window.OfflineRecognizer ===
      "function"
    ) {

      debug(
        "找到舊版 OfflineRecognizer API"
      );


      recognizer =
        new OfflineRecognizer(
          {
            featConfig: {
              sampleRate: 16000,
              featureDim: 80
            },

            modelConfig: {

              tokens:
                "./tokens.txt",

              numThreads:
                2,

              provider:
                "cpu",

              debug:
                0,

              senseVoice: {

                model:
                  "./model.int8.onnx",

                language:
                  "zh",

                useInverseTextNormalization:
                  1

              }

            },

            decodingMethod:
              "greedy_search"

          },
          wasmModule
        );

    } else {

      /*
       * 新版 API 建立 SenseVoice
       */

      if (
        !window.SherpaOnnx
      ) {

        throw new Error(
          "找不到 SherpaOnnx API"
        );

      }


      const api =
        window.SherpaOnnx();


      if (
        !api
      ) {

        throw new Error(
          "SherpaOnnx 初始化失敗"
        );

      }


      debug(
        "使用新版 SherpaOnnx API"
      );


      /*
       * 建立 SenseVoice model config
       */

      if (
        typeof api.OfflineRecognizer !==
        "function"
      ) {

        throw new Error(
          "目前 sherpa-onnx WASM 沒有 OfflineRecognizer API。\n" +
          "請確認 GitHub Actions 使用同一版本的 sherpa-onnx。"
        );

      }


      const modelConfig =
        api.OfflineModelConfig();


      modelConfig.tokens =
        "/tokens.txt";


      modelConfig.numThreads =
        2;


      modelConfig.provider =
        "cpu";


      const senseVoice =
        api.OfflineSenseVoiceModelConfig();


      senseVoice.model =
        "/model.int8.onnx";


      senseVoice.language =
        "zh";


      senseVoice.useInverseTextNormalization =
        true;


      modelConfig.senseVoice =
        senseVoice;


      const config =
        api.OfflineRecognizerConfig();


      config.featConfig.sampleRate =
        16000;


      config.featConfig.featureDim =
        80;


      config.modelConfig =
        modelConfig;


      config.decodingMethod =
        "greedy_search";


      recognizer =
        new api.OfflineRecognizer(
          config
        );

    }


    /* -----------------------------------------------------
       Ready
       --------------------------------------------------- */

    if (
      !recognizer
    ) {

      throw new Error(
        "Recognizer 建立失敗"
      );

    }


    progress(
      100,
      "模型已準備完成"
    );


    progressPercent.textContent =
      "完成";


    status(
      "✅ 模型已載入，可以開始說話。"
    );


    micButton.disabled =
      false;


    debug(
      "SenseVoice ready."
    );


  } catch (error) {

    console.error(
      error
    );


    debug(
      "ERROR: " +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );


    recognizer =
      null;


    micButton.disabled =
      true;


    loadButton.disabled =
      false;


    progress(
      0,
      "載入失敗"
    );


    status(
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  } finally {

    loading =
      false;

  }

}


/* =========================================================
   Start recording
   ========================================================= */

async function startRecording() {

  if (
    !recognizer
  ) {

    status(
      "請先載入模型。"
    );

    return;

  }


  if (
    recording
  ) {

    return;

  }


  try {

    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }
      );


    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    const sampleRate =
      audioContext.sampleRate;


    debug(
      "AudioContext sample rate: " +
      sampleRate
    );


    mediaSource =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    /*
     * 舊版 OfflineRecognizer
     */

    if (
      typeof recognizer.createStream ===
      "function"
    ) {

      audioStream =
        recognizer.createStream();

    }


    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processor.onaudioprocess =
      function(event) {

        if (
          !audioStream
        ) {

          return;

        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          new Float32Array(
            input.length
          );


        samples.set(
          input
        );


        audioStream.acceptWaveform(
          sampleRate,
          samples
        );

      };


    mediaSource.connect(
      processor
    );


    silentGain =
      audioContext.createGain();


    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    recording =
      true;


    micButton.textContent =
      "⏹ 停止";


    micButton.classList.add(
      "stop"
    );


    status(
      "🔴 錄音中…說完後按「停止」。"
    );


  } catch (error) {

    console.error(
      error
    );


    cleanupAudio();


    status(
      "麥克風錯誤：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }

}


/* =========================================================
   Stop
   ========================================================= */

async function stopRecording() {

  if (
    !recording
  ) {

    return;

  }


  recording =
    false;


  micButton.disabled =
    true;


  status(
    "錄音完成，正在辨識…"
  );


  try {

    if (
      processor
    ) {

      processor.onaudioprocess =
        null;

    }


    if (
      mediaStream
    ) {

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if (
      audioContext
    ) {

      try {

        await audioContext.close();

      } catch (_) {}

    }


    if (
      !audioStream
    ) {

      throw new Error(
        "沒有建立 OfflineStream"
      );

    }


    /*
     * Decode
     */

    if (
      typeof recognizer.decode ===
      "function"
    ) {

      recognizer.decode(
        audioStream
      );

    }


    let result =
      null;


    if (
      typeof recognizer.getResult ===
      "function"
    ) {

      result =
        recognizer.getResult(
          audioStream
        );

    }


    debug(
      "Recognition result: " +
      JSON.stringify(
        result
      )
    );


    if (
      result &&
      result.text
    ) {

      outputElement.value =
        result.text;


      status(
        "✅ 完成。"
      );

    } else {

      status(
        "沒有辨識到文字。"
      );

    }


    try {

      if (
        audioStream &&
        typeof audioStream.free ===
          "function"
      ) {

        audioStream.free();

      }

    } catch (_) {}


  } catch (error) {

    console.error(
      error
    );


    debug(
      "Recognition error: " +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );


    status(
      "辨識失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    cleanupAudio();


    micButton.disabled =
      false;


    micButton.textContent =
      "② 開始說話";


    micButton.classList.remove(
      "stop"
    );

  }

}


/* =========================================================
   Cleanup
   ========================================================= */

function cleanupAudio() {

  if (
    processor
  ) {

    try {

      processor.disconnect();

    } catch (_) {}

  }


  if (
    mediaSource
  ) {

    try {

      mediaSource.disconnect();

    } catch (_) {}

  }


  if (
    silentGain
  ) {

    try {

      silentGain.disconnect();

    } catch (_) {}

  }


  if (
    mediaStream
  ) {

    mediaStream
      .getTracks()
      .forEach(
        track => {

          try {

            track.stop();

          } catch (_) {}

        }
      );

  }


  processor =
    null;

  mediaSource =
    null;

  silentGain =
    null;

  mediaStream =
    null;

  audioContext =
    null;

  audioStream =
    null;

}


/* =========================================================
   Buttons
   ========================================================= */

loadButton.addEventListener(
  "click",
  loadModel
);


micButton.addEventListener(
  "click",
  async function() {

    if (
      recording
    ) {

      await stopRecording();

    } else {

      await startRecording();

    }

  }
);


clearButton.addEventListener(
  "click",
  function() {

    outputElement.value =
      "";

    status(
      recognizer
        ? "模型已載入，可以開始說話。"
        : "等待載入模型。"
    );

  }
);


/* =========================================================
   Startup
   ========================================================= */

debug(
  "Page loaded."
);

debug(
  "Model URL: " +
  MODEL_URL
);

debug(
  "WASM script loaded."
);

</script>

</body>
</html>
