<body>

<main>
<div class="box">

sherpa-onnx · iPhone 瀏覽器離線中文語音輸入

<script>
"use strict";


/* =====================================================
   DOM
===================================================== */

const loadButton =
  document.getElementById("load");

const micButton =
  document.getElementById("mic");

const clearButton =
  document.getElementById("clear");

const statusElement =
  document.getElementById("status");

const outputElement =
  document.getElementById("out");

const progressBox =
  document.getElementById("progressBox");

const progressText =
  document.getElementById("progressText");

const progressPercent =
  document.getElementById("progressPercent");

const progressFill =
  document.getElementById("progressFill");


/* =====================================================
   State
===================================================== */

let wasmModule = null;
let sherpa = null;
let recognizer = null;

let audioContext = null;
let mediaStream = null;
let mediaSource = null;
let processor = null;
let silentGain = null;

let audioStream = null;

let loading = false;
let recording = false;


/* =====================================================
   UI
===================================================== */

function setStatus(text) {
  statusElement.textContent = text;
}


function setProgress(percent, text) {

  percent = Math.max(
    0,
    Math.min(100, percent)
  );

  progressFill.style.width =
    percent + "%";

  progressPercent.textContent =
    Math.round(percent) + "%";

  if (text !== undefined) {
    progressText.textContent = text;
  }
}


function formatMB(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes <= 0
  ) {
    return "0 MB";
  }

  return (
    bytes /
    1024 /
    1024
  ).toFixed(1) + " MB";
}


/* =====================================================
   Dynamic script loader
===================================================== */

function loadScript(src) {

  return new Promise(
    (resolve, reject) => {

      /*
       * 避免同一個 script 重複載入。
       */

      const old =
        document.querySelector(
          'script[data-src="' +
          src +
          '"]'
        );

      if (old) {

        if (old.dataset.loaded === "1") {
          resolve();
          return;
        }

        old.addEventListener(
          "load",
          resolve,
          { once: true }
        );

        old.addEventListener(
          "error",
          () => reject(
            new Error(
              "載入失敗：" + src
            )
          ),
          { once: true }
        );

        return;
      }


      const script =
        document.createElement("script");

      script.src = src;

      script.async = false;

      script.dataset.src = src;

      script.onload = () => {

        script.dataset.loaded = "1";

        resolve();
      };

      script.onerror = () => {

        reject(
          new Error(
            "JavaScript 載入失敗：" +
            src
          )
        );
      };

      document.head.appendChild(script);
    }
  );
}


/* =====================================================
   Wait for global SherpaOnnx
===================================================== */

async function waitForSherpaOnnx() {

  for (
    let i = 0;
    i < 400;
    i++
  ) {

    if (
      typeof window.SherpaOnnx !==
      "undefined"
    ) {

      return window.SherpaOnnx;
    }

    await new Promise(
      resolve =>
        setTimeout(resolve, 50)
    );
  }

  throw new Error(
    "WASM ERROR：找不到 window.SherpaOnnx。"
  );
}


/* =====================================================
   Load WASM
===================================================== */

async function loadWasm() {

  setStatus(
    "正在載入 sherpa-onnx WebAssembly…"
  );


  /*
   * 載入 sherpa-onnx wasm JS。
   */

  await loadScript(
    "./assets/sherpa-onnx-wasm-web.js"
  );


  /*
   * 等待 SherpaOnnx 出現。
   */

  sherpa =
    await waitForSherpaOnnx();


  console.log(
    "window.SherpaOnnx =",
    sherpa
  );


  /*
   * 某些 build 的 SherpaOnnx
   * 本身就是 Emscripten factory。
   */

  if (
    typeof sherpa === "function"
  ) {

    setStatus(
      "正在初始化 WebAssembly…"
    );


    wasmModule =
      await sherpa({
        locateFile: function(path) {

          return (
            "./assets/" +
            path
          );
        }
      });

  } else {

    /*
     * 如果它已經是 Module，
     * 直接使用。
     */

    wasmModule =
      sherpa;
  }


  if (!wasmModule) {

    throw new Error(
      "WASM 初始化失敗：沒有取得 Module。"
    );
  }


  console.log(
    "WASM Module =",
    wasmModule
  );


  /*
   * 確認 FS。
   */

  if (
    !wasmModule.FS
  ) {

    throw new Error(
      "WASM 初始化完成，但沒有提供 Emscripten FS。"
    );
  }


  if (
    typeof wasmModule.FS.writeFile !==
    "function"
  ) {

    throw new Error(
      "WASM FS 存在，但沒有 FS.writeFile。"
    );
  }


  console.log(
    "OK：wasmModule.FS.writeFile"
  );
}


/* =====================================================
   Load ASR API
===================================================== */

async function loadAsrApi() {

  setStatus(
    "正在載入 sherpa-onnx JavaScript API…"
  );


  await loadScript(
    "./assets/sherpa-onnx-asr.js"
  );


  console.log(
    "sherpa-onnx-asr.js loaded"
  );


  /*
   * 顯示 API 方便除錯。
   */

  console.log(
    "SherpaOnnx API =",
    window.SherpaOnnx
  );


  if (
    !window.SherpaOnnx
  ) {

    throw new Error(
      "sherpa-onnx-asr.js 載入成功，但找不到 SherpaOnnx。"
    );
  }
}


/* =====================================================
   Download with real progress
===================================================== */

async function downloadFile(
  url,
  name
) {

  setStatus(
    "正在下載 " +
    name +
    "…"
  );


  setProgress(
    0,
    "連線中…"
  );


  const response =
    await fetch(
      url,
      {
        cache: "default"
      }
    );


  if (!response.ok) {

    throw new Error(
      name +
      "下載失敗：" +
      response.status +
      " " +
      response.statusText
    );
  }


  /*
   * Content-Length。
   */

  const contentLength =
    response.headers.get(
      "Content-Length"
    );


  const total =
    contentLength
      ? Number(contentLength)
      : 0;


  console.log(
    name,
    "Content-Length =",
    total
  );


  /*
   * 如果瀏覽器沒有 stream。
   */

  if (!response.body) {

    const buffer =
      await response.arrayBuffer();


    setProgress(
      100,
      formatMB(
        buffer.byteLength
      )
    );


    return new Uint8Array(
      buffer
    );
  }


  const reader =
    response.body.getReader();

  const chunks = [];

  let received = 0;


  while (true) {

    const result =
      await reader.read();


    if (result.done) {
      break;
    }


    if (
      result.value
    ) {

      chunks.push(
        result.value
      );


      received +=
        result.value.byteLength;


      if (total > 0) {

        const percent =
          received /
          total *
          100;


        setProgress(
          percent,
          formatMB(received) +
          " / " +
          formatMB(total)
        );


        setStatus(
          "正在下載 " +
          name +
          "… " +
          Math.round(percent) +
          "%"
        );

      } else {

        /*
         * 沒有 Content-Length。
         */

        setProgress(
          0,
          formatMB(received)
        );


        setStatus(
          "正在下載 " +
          name +
          "… " +
          formatMB(received)
        );
      }
    }
  }


  const data =
    new Uint8Array(
      received
    );


  let offset = 0;


  for (
    const chunk of chunks
  ) {

    data.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;
  }


  setProgress(
    100,
    formatMB(received)
  );


  return data;
}


/* =====================================================
   Write model to WASM FS
===================================================== */

function writeWasmFile(
  filename,
  data
) {

  if (
    !wasmModule ||
    !wasmModule.FS
  ) {

    throw new Error(
      "WASM FS 不存在。"
    );
  }


  const FS =
    wasmModule.FS;


  /*
   * 刪除舊檔。
   */

  try {

    FS.unlink(
      "/" + filename
    );

  } catch (_) {}


  /*
   * 新版 Emscripten。
   */

  if (
    typeof FS.writeFile ===
    "function"
  ) {

    FS.writeFile(
      "/" + filename,
      data
    );

    console.log(
      "WASM FS write:",
      filename,
      data.byteLength || data.length
    );

    return;
  }


  throw new Error(
    "WASM FS 沒有 writeFile。"
  );
}


/* =====================================================
   Find OfflineRecognizer
===================================================== */

function getOfflineRecognizerClass() {

  /*
   * 新版：
   *
   * SherpaOnnx.OfflineRecognizer
   */

  if (
    window.SherpaOnnx &&
    typeof window.SherpaOnnx
      .OfflineRecognizer ===
      "function"
  ) {

    return window.SherpaOnnx
      .OfflineRecognizer;
  }


  /*
   * 某些版本：
   *
   * window.OfflineRecognizer
   */

  if (
    typeof window.OfflineRecognizer ===
    "function"
  ) {

    return window.OfflineRecognizer;
  }


  return null;
}


/* =====================================================
   Create recognizer
===================================================== */

async function createRecognizer() {

  setStatus(
    "正在建立 SenseVoice 辨識器…"
  );


  const OfflineRecognizer =
    getOfflineRecognizerClass();


  if (!OfflineRecognizer) {

    console.error(
      "window.SherpaOnnx =",
      window.SherpaOnnx
    );


    throw new Error(
      "找不到 OfflineRecognizer。\n\n" +
      "目前載入的 sherpa-onnx-asr.js " +
      "不是這個 HTML 所使用的 API 版本。"
    );
  }


  /*
   * SenseVoice config。
   */

  const config = {

    featConfig: {

      sampleRate:
        16000,

      featureDim:
        80
    },


    modelConfig: {

      tokens:
        "/tokens.txt",

      numThreads:
        2,

      provider:
        "cpu",

      debug:
        0,


      senseVoice: {

        model:
          "/model.int8.onnx",

        language:
          "zh",

        useInverseTextNormalization:
          1
      }
    },


    decodingMethod:
      "greedy_search"
  };


  console.log(
    "OfflineRecognizer config:",
    config
  );


  /*
   * 建立 recognizer。
   */

  try {

    recognizer =
      new OfflineRecognizer(
        config,
        wasmModule
      );

  } catch (firstError) {

    console.warn(
      "OfflineRecognizer(config, Module) failed:",
      firstError
    );


    /*
     * 有些新版 wrapper
     * 不需要第二個參數。
     */

    recognizer =
      new OfflineRecognizer(
        config
      );
  }


  if (!recognizer) {

    throw new Error(
      "SenseVoice 辨識器建立失敗。"
    );
  }


  console.log(
    "Recognizer =",
    recognizer
  );
}


/* =====================================================
   Load everything
===================================================== */

async function loadModel() {

  if (
    loading ||
    recognizer
  ) {
    return;
  }


  loading = true;

  loadButton.disabled =
    true;

  micButton.disabled =
    true;

  progressBox.hidden =
    false;


  try {

    /*
     * 1. WASM
     */

    setProgress(
      0,
      "準備 WebAssembly…"
    );

    await loadWasm();


    /*
     * 2. ASR API
     */

    await loadAsrApi();


    /*
     * 3. Model
     */

    const modelData =
      await downloadFile(
        "./assets/model.int8.onnx",
        "SenseVoice INT8 模型"
      );


    /*
     * 4. Tokens
     */

    const tokensData =
      await downloadFile(
        "./assets/tokens.txt",
        "tokens.txt"
      );


    /*
     * 5. Write model
     */

    setStatus(
      "正在準備模型檔案…"
    );


    setProgress(
      100,
      "正在寫入 WASM…"
    );


    writeWasmFile(
      "model.int8.onnx",
      modelData
    );


    /*
     * tokens 必須是 UTF-8。
     */

    const tokenBytes =
      new TextEncoder().encode(
        new TextDecoder().decode(
          tokensData
        )
      );


    writeWasmFile(
      "tokens.txt",
      tokenBytes
    );


    /*
     * 6. Recognizer
     */

    await createRecognizer();


    /*
     * 7. Ready
     */

    setProgress(
      100,
      "模型已準備完成"
    );

    progressPercent.textContent =
      "完成";


    setStatus(
      "模型已載入，可以開始說話。"
    );


    micButton.disabled =
      false;


    console.log(
      "SenseVoice READY"
    );


  } catch (error) {

    console.error(
      "MODEL LOAD ERROR:",
      error
    );


    recognizer =
      null;


    loadButton.disabled =
      false;


    micButton.disabled =
      true;


    setProgress(
      0,
      "載入失敗"
    );


    setStatus(
      "載入失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    loading =
      false;
  }
}


/* =====================================================
   Start recording
===================================================== */

async function startRecording() {

  if (!recognizer) {

    setStatus(
      "請先載入模型。"
    );

    return;
  }


  if (recording) {
    return;
  }


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "目前瀏覽器不支援麥克風。"
      );
    }


    /*
     * Microphone
     */

    mediaStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            channelCount:
              1,

            echoCancellation:
              false,

            noiseSuppression:
              false,

            autoGainControl:
              false
          }
        });


    /*
     * AudioContext
     */

    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    console.log(
      "Audio sample rate:",
      audioContext.sampleRate
    );


    /*
     * Source
     */

    mediaSource =
      audioContext
        .createMediaStreamSource(
          mediaStream
        );


    /*
     * Create sherpa stream
     */

    audioStream =
      recognizer.createStream();


    if (!audioStream) {

      throw new Error(
        "無法建立辨識音訊 Stream。"
      );
    }


    /*
     * ScriptProcessor。
     */

    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processor.onaudioprocess =
      event => {

        if (!audioStream) {
          return;
        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          new Float32Array(
            input.length
          );


        samples.set(
          input
        );


        /*
         * sherpa-onnx 新 API。
         *
         * acceptWaveform({
         *   samples,
         *   sampleRate
         * })
         */

        try {

          audioStream.acceptWaveform({

            samples:
              samples,

            sampleRate:
              audioContext.sampleRate

          });

        } catch (error) {

          console.error(
            "acceptWaveform error:",
            error
          );
        }
      };


    mediaSource.connect(
      processor
    );


    /*
     * 靜音輸出。
     */

    silentGain =
      audioContext.createGain();

    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );

    silentGain.connect(
      audioContext.destination
    );


    recording =
      true;


    micButton.textContent =
      "⏹ 停止";


    micButton.classList.add(
      "stop"
    );


    setStatus(
      "🔴 錄音中…說完後按「停止」。"
    );


  } catch (error) {

    console.error(
      "MIC ERROR:",
      error
    );


    cleanupAudio();


    setStatus(
      "麥克風錯誤：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );
  }
}


/* =====================================================
   Stop recording
===================================================== */

async function stopRecording() {

  if (!recording) {
    return;
  }


  recording =
    false;


  micButton.disabled =
    true;


  setStatus(
    "錄音完成，正在辨識…"
  );


  try {

    /*
     * 停止 callback。
     */

    if (processor) {

      processor.onaudioprocess =
        null;
    }


    /*
     * 停止 microphone。
     */

    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }


    /*
     * 關閉 AudioContext。
     */

    if (audioContext) {

      try {

        await audioContext.close();

      } catch (_) {}
    }


    /*
     * Decode。
     */

    if (!audioStream) {

      throw new Error(
        "沒有錄音資料。"
      );
    }


    /*
     * 補尾端音訊。
     */

    try {

      audioStream.inputFinished();

    } catch (_) {}


    /*
     * Decode。
     */

    recognizer.decode(
      audioStream
    );


    const result =
      recognizer.getResult(
        audioStream
      );


    console.log(
      "Recognition result:",
      result
    );


    if (
      result &&
      result.text
    ) {

      outputElement.value =
        result.text;


      setStatus(
        "完成。"
      );

    } else {

      setStatus(
        "沒有辨識到文字。"
      );
    }


    /*
     * Free。
     */

    try {

      audioStream.free();

    } catch (_) {}


  } catch (error) {

    console.error(
      "RECOGNITION ERROR:",
      error
    );


    setStatus(
      "辨識失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    cleanupAudio();


    micButton.disabled =
      false;


    micButton.textContent =
      "② 開始說話";


    micButton.classList.remove(
      "stop"
    );
  }
}


/* =====================================================
   Cleanup
===================================================== */

function cleanupAudio() {

  if (processor) {

    try {

      processor.disconnect();

    } catch (_) {}
  }


  if (mediaSource) {

    try {

      mediaSource.disconnect();

    } catch (_) {}
  }


  if (silentGain) {

    try {

      silentGain.disconnect();

    } catch (_) {}
  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track => {

          try {
            track.stop();
          } catch (_) {}

        }
      );
  }


  processor =
    null;

  mediaSource =
    null;

  silentGain =
    null;

  mediaStream =
    null;

  audioContext =
    null;

  audioStream =
    null;
}


/* =====================================================
   Buttons
===================================================== */

loadButton.addEventListener(
  "click",
  loadModel
);


micButton.addEventListener(
  "click",
  async () => {

    if (recording) {

      await stopRecording();

    } else {

      await startRecording();
    }

  }
);


clearButton.addEventListener(
  "click",
  () => {

    outputElement.value =
      "";

    if (recognizer) {

      setStatus(
        "模型已載入，可以開始說話。"
      );

    } else {

      setStatus(
        "等待載入模型。"
      );
    }

  }
);


/* =====================================================
   Service Worker
===================================================== */

if (
  "serviceWorker" in navigator
) {

  navigator.serviceWorker
    .register("./sw.js")
    .then(
      registration => {

        console.log(
          "Service Worker OK:",
          registration.scope
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Service Worker:",
          error
        );

      }
    );
}
