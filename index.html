<script>

/* =========================================================

const MODEL_URL =

const TOKENS_URL =
"https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/resolve/main/tokens.txt";


/* =========================================================

   ========================================================= */

var Module = {

  locateFile: function(path) {

    console.log(
      "locateFile:",
      path
    );

    return (
      "./assets/" +
      path
    );
  },

<!-- =======================================================
     3. Emscripten WASM factory
     ======================================================= -->

<script
  src="./assets/sherpa-onnx-wasm-web.js"
></script>


<script>

/* =========================================================
   4. State
   ========================================================= */

let wasmModule = null;

let recognizer = null;

let audioContext = null;

let mediaStream = null;

let mediaSource = null;

let processor = null;

let silentGain = null;

let audioStream = null;

let recording = false;

let loading = false;


/* =========================================================
   5. DOM
   ========================================================= */

const loadButton =
  document.getElementById(
    "loadButton"
  );

const micButton =
  document.getElementById(
    "micButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const outputElement =
  document.getElementById(
    "output"
  );

const progressBox =
  document.getElementById(
    "progressBox"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const progressPercent =
  document.getElementById(
    "progressPercent"
  );

const progressFill =
  document.getElementById(
    "progressFill"
  );

const debugElement =
  document.getElementById(
    "debug"
  );


/* =========================================================
   6. Helpers
   ========================================================= */

function setStatus(text) {

  statusElement.textContent =
    text;

}


function log(text) {

  console.log(text);

  debugElement.textContent +=
    text + "\n";

}


function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes)
  ) {

    return "0 B";

  }

  if (
    bytes < 1024
  ) {

    return (
      bytes.toFixed(0) +
      " B"
    );

  }

  if (
    bytes < 1024 * 1024
  ) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / 1024 / 1024).toFixed(1) +
    " MB"
  );

}


function setProgress(
  percent,
  text
) {

  percent =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  progressFill.style.width =
    percent + "%";

  progressPercent.textContent =
    Math.round(percent) + "%";

  if (
    text !== undefined
  ) {

    progressText.textContent =
      text;

  }

}


/* =========================================================
   7. Initialize Emscripten WASM
   ========================================================= */

async function initializeWasm() {

  /*
   * 這是這次最重要的修正。
   *
   * 不再：
   *
   *   window.SherpaOnnx()
   *
   * 而是：
   *
   *   window.SherpaOnnx(Module)
   */

  if (
    typeof window.SherpaOnnx !==
    "function"
  ) {

    throw new Error(
      "sherpa-onnx-wasm-web.js 已載入，但沒有找到 window.SherpaOnnx factory。"
    );

  }


  log(
    "找到 window.SherpaOnnx factory"
  );


  setStatus(
    "正在初始化 WebAssembly…"
  );


  /*
   * 傳入我們事先設定好的 Module。
   */

  wasmModule =
    await window.SherpaOnnx(
      Module
    );


  if (
    !wasmModule
  ) {

    throw new Error(
      "SherpaOnnx(Module) 沒有返回 Module。"
    );

  }


  /*
   * 某些 Emscripten build 會把
   * Module 自己作為返回值。
   */

  if (
    wasmModule.FS
  ) {

    log(
      "找到 wasmModule.FS"
    );

  }


  /*
   * 確認 FS.writeFile。
   */

  if (
    !wasmModule.FS ||
    typeof wasmModule.FS.writeFile !==
      "function"
  ) {

    throw new Error(
      "WASM 初始化成功，但找不到 wasmModule.FS.writeFile。"
    );

  }


  log(
    "OK：wasmModule.FS.writeFile"
  );


  return wasmModule;

}


/* =========================================================
   8. Download with progress
   ========================================================= */

async function downloadFile(
  url,
  label
) {

  setStatus(
    "正在下載 " +
    label +
    "…"
  );


  setProgress(
    0,
    "連線中…"
  );


  log(
    "下載：" + url
  );


  const response =
    await fetch(
      url,
      {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        cache: "default"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      label +
      "下載失敗：" +
      response.status +
      " " +
      response.statusText
    );

  }


  const length =
    response.headers.get(
      "Content-Length"
    );


  const total =
    length
      ? Number(length)
      : 0;


  log(
    label +
    " Content-Length: " +
    (
      total
        ? formatBytes(total)
        : "未知"
    )
  );


  /*
   * 沒有 ReadableStream 時，
   * 使用 arrayBuffer。
   */

  if (
    !response.body
  ) {

    const buffer =
      await response.arrayBuffer();


    setProgress(
      100,
      label +
      " " +
      formatBytes(
        buffer.byteLength
      )
    );


    return new Uint8Array(
      buffer
    );

  }


  const reader =
    response.body.getReader();


  const chunks = [];

  let received = 0;


  while (true) {

    const result =
      await reader.read();


    if (
      result.done
    ) {

      break;

    }


    if (
      result.value
    ) {

      chunks.push(
        result.value
      );


      received +=
        result.value.byteLength;


      if (
        total > 0
      ) {

        const percent =
          received /
          total *
          100;


        setProgress(
          percent,
          formatBytes(received) +
          " / " +
          formatBytes(total)
        );


        setStatus(
          "正在下載 " +
          label +
          "… " +
          Math.round(
            percent
          ) +
          "%"
        );

      } else {

        /*
         * Hugging Face 如果沒有提供
         * Content-Length，
         * 至少顯示目前已下載大小。
         */

        setProgress(
          0,
          "已下載 " +
          formatBytes(received)
        );


        progressPercent.textContent =
          formatBytes(received);


        setStatus(
          "正在下載 " +
          label +
          "… " +
          formatBytes(received)
        );

      }

    }

  }


  const data =
    new Uint8Array(
      received
    );


  let offset = 0;


  for (
    const chunk of chunks
  ) {

    data.set(
      chunk,
      offset
    );


    offset +=
      chunk.byteLength;

  }


  setProgress(
    100,
    label +
    " 完成：" +
    formatBytes(received)
  );


  log(
    label +
    " 完成：" +
    formatBytes(received)
  );


  return data;

}


/* =========================================================
   9. Write files into Emscripten FS
   ========================================================= */

function writeWasmFile(
  filename,
  data
) {

  if (
    !wasmModule
  ) {

    throw new Error(
      "WASM Module 不存在。"
    );

  }


  if (
    !wasmModule.FS
  ) {

    throw new Error(
      "WASM FS 不存在。"
    );

  }


  if (
    typeof wasmModule.FS.writeFile !==
      "function"
  ) {

    throw new Error(
      "WASM FS.writeFile 不存在。"
    );

  }


  /*
   * 先刪除舊檔案。
   */

  try {

    wasmModule.FS.unlink(
      "/" + filename
    );

  } catch (_) {}


  /*
   * 寫入。
   */

  wasmModule.FS.writeFile(
    "/" + filename,
    data
  );


  log(
    "FS.writeFile OK: /" +
    filename
  );

}


/* =========================================================
   10. Load ASR helper
   ========================================================= */

async function loadAsrApi() {

  /*
   * asr.js 必須在 WASM 初始化後使用。
   *
   * 這個檔案定義：
   *
   * OfflineRecognizer
   * OfflineStream
   */

  await new Promise(
    function(resolve, reject) {

      const script =
        document.createElement(
          "script"
        );


      script.src =
        "./assets/sherpa-onnx-asr.js";


      script.onload =
        function() {

          log(
            "sherpa-onnx-asr.js 載入成功"
          );

          resolve();

        };


      script.onerror =
        function() {

          reject(
            new Error(
              "sherpa-onnx-asr.js 載入失敗"
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );


  /*
   * 注意：
   *
   * sherpa-onnx-asr.js 是 classic script。
   *
   * 它裡面的 OfflineRecognizer
   * 是 global lexical binding，
   * 不一定會出現在 window.OfflineRecognizer。
   *
   * 所以不能只檢查：
   *
   * window.OfflineRecognizer
   */

  if (
    typeof OfflineRecognizer !==
    "function"
  ) {

    throw new Error(
      "sherpa-onnx-asr.js 已載入，但 OfflineRecognizer 不存在。"
    );

  }


  log(
    "OK：OfflineRecognizer"
  );

}


/* =========================================================
   11. Create SenseVoice recognizer
   ========================================================= */

function createRecognizer() {

  setStatus(
    "正在建立 SenseVoice 辨識器…"
  );


  /*
   * 官方 sherpa-onnx JS API
   * 使用這個 config 結構。
   */

  const config = {

    featConfig: {

      sampleRate:
        16000,

      featureDim:
        80

    },


    modelConfig: {

      /*
       * 模型與 tokens
       * 已經寫入 WASM FS。
       */

      tokens:
        "./tokens.txt",

      numThreads:
        1,

      provider:
        "cpu",

      debug:
        0,


      senseVoice: {

        model:
          "./model.int8.onnx",

        language:
          "zh",

        useInverseTextNormalization:
          1

      }

    },


    decodingMethod:
      "greedy_search"

  };


  log(
    "建立 OfflineRecognizer..."
  );


  /*
   * 這裡是官方 asr.js 的正確呼叫方式：
   *
   * new OfflineRecognizer(config, Module)
   */

  recognizer =
    new OfflineRecognizer(
      config,
      wasmModule
    );


  if (
    !recognizer
  ) {

    throw new Error(
      "OfflineRecognizer 建立失敗。"
    );

  }


  log(
    "OK：OfflineRecognizer 建立完成"
  );

}


/* =========================================================
   12. Complete model loading
   ========================================================= */

async function loadModel() {

  if (
    loading
  ) {

    return;

  }


  if (
    recognizer
  ) {

    setStatus(
      "模型已經載入。"
    );

    return;

  }


  loading =
    true;


  loadButton.disabled =
    true;


  micButton.disabled =
    true;


  progressBox.hidden =
    false;


  try {

    /*
     * ---------------------------------------------
     * A. WASM
     * ---------------------------------------------
     */

    await initializeWasm();


    /*
     * ---------------------------------------------
     * B. Model
     * ---------------------------------------------
     */

    const modelData =
      await downloadFile(
        MODEL_URL,
        "SenseVoice INT8 模型"
      );


    /*
     * ---------------------------------------------
     * C. Tokens
     * ---------------------------------------------
     */

    const tokensData =
      await downloadFile(
        TOKENS_URL,
        "tokens.txt"
      );


    /*
     * ---------------------------------------------
     * D. Write FS
     * ---------------------------------------------
     */

    setStatus(
      "正在寫入 WASM 檔案系統…"
    );


    setProgress(
      100,
      "寫入 model.int8.onnx…"
    );


    writeWasmFile(
      "model.int8.onnx",
      modelData
    );


    setProgress(
      100,
      "寫入 tokens.txt…"
    );


    const tokensText =
      new TextDecoder(
        "utf-8"
      ).decode(
        tokensData
      );


    writeWasmFile(
      "tokens.txt",
      tokensText
    );


    /*
     * ---------------------------------------------
     * E. ASR API
     * ---------------------------------------------
     */

    await loadAsrApi();


    /*
     * ---------------------------------------------
     * F. Recognizer
     * ---------------------------------------------
     */

    createRecognizer();


    /*
     * ---------------------------------------------
     * READY
     * ---------------------------------------------
     */

    setProgress(
      100,
      "模型準備完成"
    );


    progressPercent.textContent =
      "完成";


    setStatus(
      "✅ 模型已載入，可以開始說話。"
    );


    micButton.disabled =
      false;


    log(
      "================================"
    );

    log(
      "SenseVoice READY"
    );

    log(
      "================================"
    );


  } catch (error) {

    console.error(
      "LOAD ERROR:",
      error
    );


    log(
      "ERROR: " +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );


    recognizer =
      null;


    loadButton.disabled =
      false;


    micButton.disabled =
      true;


    setProgress(
      0,
      "載入失敗"
    );


    setStatus(
      "載入失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    loading =
      false;

  }

}


/* =========================================================
   13. Start microphone
   ========================================================= */

async function startRecording() {

  if (
    !recognizer
  ) {

    setStatus(
      "請先載入模型。"
    );

    return;

  }


  if (
    recording
  ) {

    return;

  }


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "此瀏覽器不支援麥克風。"
      );

    }


    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }
      );


    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    const sampleRate =
      audioContext.sampleRate;


    log(
      "Microphone sample rate: " +
      sampleRate
    );


    /*
     * 建立 OfflineStream。
     */

    audioStream =
      recognizer.createStream();


    if (
      !audioStream
    ) {

      throw new Error(
        "無法建立 OfflineStream。"
      );

    }


    mediaSource =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processor.onaudioprocess =
      function(event) {

        if (
          !audioStream
        ) {

          return;

        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          new Float32Array(
            input.length
          );


        samples.set(
          input
        );


        /*
         * sherpa-onnx OfflineStream
         * 的 API 是：
         *
         * acceptWaveform(
         *   sampleRate,
         *   samples
         * )
         */

        audioStream.acceptWaveform(
          sampleRate,
          samples
        );

      };


    mediaSource.connect(
      processor
    );


    /*
     * 不把麥克風聲音播放出來。
     */

    silentGain =
      audioContext.createGain();


    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );


    silentGain.connect(
      audioContext.destination
    );


    recording =
      true;


    micButton.textContent =
      "⏹ 停止";

    micButton.classList.add(
      "stop"
    );


    setStatus(
      "🔴 錄音中…說完後按「停止」。"
    );


  } catch (error) {

    console.error(
      "MIC ERROR:",
      error
    );


    cleanupAudio();


    setStatus(
      "麥克風錯誤：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }

}


/* =========================================================
   14. Stop microphone + recognize
   ========================================================= */

async function stopRecording() {

  if (
    !recording
  ) {

    return;

  }


  recording =
    false;


  micButton.disabled =
    true;


  setStatus(
    "錄音完成，正在辨識…"
  );


  try {

    if (
      processor
    ) {

      processor.onaudioprocess =
        null;

    }


    /*
     * 停止麥克風。
     */

    if (
      mediaStream
    ) {

      mediaStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    /*
     * 關閉 AudioContext。
     */

    if (
      audioContext
    ) {

      try {

        await audioContext.close();

      } catch (_) {}

    }


    if (
      !audioStream
    ) {

      throw new Error(
        "沒有錄音 Stream。"
      );

    }


    /*
     * OfflineStream 不需要 inputFinished。
     *
     * 直接 decode。
     */

    recognizer.decode(
      audioStream
    );


    const result =
      recognizer.getResult(
        audioStream
      );


    log(
      "Recognition result: " +
      JSON.stringify(
        result
      )
    );


    if (
      result &&
      typeof result.text ===
        "string" &&
      result.text.trim()
    ) {

      outputElement.value =
        result.text;


      setStatus(
        "✅ 辨識完成。"
      );

    } else {

      setStatus(
        "沒有辨識到文字。"
      );

    }


    /*
     * 釋放 stream。
     */

    try {

      audioStream.free();

    } catch (_) {}


  } catch (error) {

    console.error(
      "RECOGNITION ERROR:",
      error
    );


    log(
      "Recognition ERROR: " +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );


    setStatus(
      "辨識失敗：\n" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    cleanupAudio();


    micButton.disabled =
      false;


    micButton.textContent =
      "② 開始說話";


    micButton.classList.remove(
      "stop"
    );

  }

}


/* =========================================================
   15. Cleanup audio
   ========================================================= */

function cleanupAudio() {

  if (
    processor
  ) {

    try {

      processor.disconnect();

    } catch (_) {}

  }


  if (
    mediaSource
  ) {

    try {

      mediaSource.disconnect();

    } catch (_) {}

  }


  if (
    silentGain
  ) {

    try {

      silentGain.disconnect();

    } catch (_) {}

  }


  if (
    mediaStream
  ) {

    mediaStream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          } catch (_) {}

        }
      );

  }


  processor =
    null;

  mediaSource =
    null;

  silentGain =
    null;

  mediaStream =
    null;

  audioContext =
    null;

  audioStream =
    null;

}


/* =========================================================
   16. Buttons
   ========================================================= */

loadButton.addEventListener(
  "click",
  function() {

    loadModel();

  }
);


micButton.addEventListener(
  "click",
  function() {

    if (
      recording
    ) {

      stopRecording();

    } else {

      startRecording();

    }

  }
);


clearButton.addEventListener(
  "click",
  function() {

    outputElement.value =
      "";

    if (
      recognizer
    ) {

      setStatus(
        "模型已載入，可以開始說話。"
      );

    } else {

      setStatus(
        "等待載入模型。"
      );

    }

  }
);
