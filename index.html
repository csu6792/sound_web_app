<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>SenseVoice 離線中文語音輸入</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #edf2fb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    sans-serif;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 24px 16px;
}

.box {
  background: #121a2b;
  border: 1px solid #293650;
  border-radius: 20px;
  padding: 20px;
}

h1 {
  font-size: 23px;
  margin: 0 0 5px;
}

.sub {
  color: #95a3ba;
  font-size: 13px;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 17px;
  margin: 0;
  background: #3272ed;
  color: white;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

button.gray {
  background: #29364c;
}

button.stop {
  background: #bd4054;
}

#status {
  margin: 14px 3px;
  padding: 11px;
  border-radius: 10px;
  background: #0c1423;
  color: #bac5d8;
  font-size: 13px;
  min-height: 18px;
  line-height: 1.5;
}

/* progress */

#progressBox {
  margin: 10px 3px 14px;
}

.progressInfo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 7px;
  color: #aebbd0;
  font-size: 13px;
}

#progressText {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#progressPercent {
  flex: 0 0 auto;
  font-weight: 700;
}

.progressBar {
  width: 100%;
  height: 10px;
  overflow: hidden;
  border-radius: 999px;
  background: #202b40;
}

#progressFill {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: #3272ed;
  transition: width .12s linear;
}

textarea {
  width: 100%;
  height: 250px;
  resize: vertical;
  border-radius: 14px;
  background: #080d17;
  color: white;
  border: 1px solid #2a3854;
  padding: 15px;
  font-size: 20px;
  line-height: 1.6;
  outline: none;
}

textarea:focus {
  border-color: #3272ed;
}

small {
  color: #8492a9;
  line-height: 1.6;
}

.tip {
  margin-top: 10px;
  color: #6f7f98;
  font-size: 12px;
  line-height: 1.5;
}

.log {
  margin-top: 12px;
  padding: 10px;
  border-radius: 10px;
  background: #080d17;
  color: #71819a;
  font-family: monospace;
  font-size: 11px;
  line-height: 1.5;
  max-height: 140px;
  overflow: auto;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<main>
<div class="box">

<h1>🎙 SenseVoice INT8</h1>

<div class="sub">
sherpa-onnx · iPhone 瀏覽器離線中文語音輸入
</div>

<div class="buttons">

<button id="load">
① 載入模型
</button>

<button id="mic" disabled>
② 開始說話
</button>

<button id="clear" class="gray">
清除
</button>

</div>

<div id="status">
等待載入模型。
</div>

<div id="progressBox" hidden>

<div class="progressInfo">

<span id="progressText">
準備中…
</span>

<span id="progressPercent">
0%
</span>

</div>

<div class="progressBar">

<div id="progressFill"></div>

</div>

</div>

<textarea
id="out"
placeholder="辨識結果…"
spellcheck="false"
></textarea>

<p>
<small>
第一次使用需要下載約 227 MB 的 SenseVoice INT8 模型。
完成快取後，再次使用會快很多。
所有語音辨識均在瀏覽器本機執行。
</small>
</p>

<div class="tip">
請使用 HTTPS，並允許瀏覽器使用麥克風。
</div>

<div id="log" class="log"></div>

</div>
</main>


<!-- =====================================================
     Emscripten / sherpa-onnx WASM
     ===================================================== -->

<script>
"use strict";

window.__wasmModule = null;
window.__wasmPromise = null;

function log(message) {

  console.log(message);

  const el =
    document.getElementById("log");

  if (!el) {
    return;
  }

  const line =
    document.createElement("div");

  line.textContent =
    message;

  el.appendChild(line);

  el.scrollTop =
    el.scrollHeight;
}


function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;
}


/*
 * sherpa-onnx 最新 web runtime：
 *
 * window.SherpaOnnx
 *
 * 是 Emscripten factory。
 *
 * 呼叫後會回傳 Promise，
 * Promise resolve 後才是真正的 Module。
 */

window.__wasmPromise =
  new Promise(async (resolve, reject) => {

    try {

      /*
       * 等 sherpa-onnx-wasm-web.js
       * 載入。
       */

      if (
        typeof window.SherpaOnnx !==
        "function"
      ) {

        throw new Error(
          "找不到 window.SherpaOnnx"
        );
      }

      log(
        "找到 window.SherpaOnnx factory"
      );

      setStatus(
        "正在初始化 WebAssembly…"
      );


      /*
       * 建立 Emscripten Module。
       *
       * locateFile 必須指向 assets。
       */

      const module =
        await window.SherpaOnnx({

          locateFile: function(path) {

            return (
              "./assets/" +
              path
            );

          }

        });


      if (!module) {

        throw new Error(
          "SherpaOnnx factory 沒有回傳 Module"
        );
      }


      if (
        !module.FS ||
        typeof module.FS.writeFile !==
        "function"
      ) {

        throw new Error(
          "WASM 已初始化，但沒有 FS.writeFile"
        );
      }


      window.__wasmModule =
        module;


      log(
        "OK：WASM Module 初始化完成"
      );

      log(
        "OK：wasmModule.FS.writeFile"
      );


      setStatus(
        "WebAssembly 已準備完成。"
      );


      resolve(module);

    } catch (error) {

      console.error(
        "WASM initialization error:",
        error
      );

      log(
        "WASM ERROR: " +
        (
          error.message ||
          String(error)
        )
      );

      reject(error);

    }

  });
</script>


<!-- =====================================================
     WASM runtime
     ===================================================== -->

<script
src="./assets/sherpa-onnx-wasm-web.js">
</script>


<!-- =====================================================
     sherpa API
     ===================================================== -->

<script
src="./assets/sherpa-onnx-asr.js">
</script>


<script>
"use strict";


/* =====================================================
   DOM
   ===================================================== */

const $ =
  id =>
  document.getElementById(id);

const loadButton =
  $("load");

const micButton =
  $("mic");

const clearButton =
  $("clear");

const statusElement =
  $("status");

const outputElement =
  $("out");

const progressBox =
  $("progressBox");

const progressText =
  $("progressText");

const progressPercent =
  $("progressPercent");

const progressFill =
  $("progressFill");


/* =====================================================
   State
   ===================================================== */

let wasmModule =
  null;

let recognizer =
  null;

let loading =
  false;

let recording =
  false;

let audioContext =
  null;

let mediaStream =
  null;

let mediaSource =
  null;

let processor =
  null;

let silentGain =
  null;

let stream =
  null;


/* =====================================================
   Progress
   ===================================================== */

function setProgress(
  percent,
  text
) {

  const p =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progressFill.style.width =
    p + "%";

  progressPercent.textContent =
    Math.round(p) + "%";

  if (
    text !== undefined
  ) {

    progressText.textContent =
      text;
  }
}


function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes <= 0
  ) {

    return "0 MB";
  }

  return (
    bytes /
    1024 /
    1024
  ).toFixed(1) + " MB";
}


/* =====================================================
   Fetch with real progress
   ===================================================== */

async function fetchBytes(
  url,
  onProgress
) {

  const response =
    await fetch(
      url,
      {
        cache: "default"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status +
      ": " +
      url
    );
  }


  const totalHeader =
    response.headers.get(
      "Content-Length"
    );

  const total =
    totalHeader
      ? Number(totalHeader)
      : 0;


  /*
   * Service Worker / CDN 有時候
   * 沒有 Content-Length。
   */

  if (!response.body) {

    const buffer =
      new Uint8Array(
        await response.arrayBuffer()
      );

    onProgress(
      buffer.byteLength,
      total ||
      buffer.byteLength
    );

    return buffer;
  }


  const reader =
    response.body.getReader();

  const chunks = [];

  let received =
    0;


  while (true) {

    const {
      done,
      value
    } =
      await reader.read();


    if (done) {
      break;
    }


    if (!value) {
      continue;
    }


    chunks.push(value);

    received +=
      value.byteLength;


    onProgress(
      received,
      total
    );
  }


  const result =
    new Uint8Array(
      received
    );

  let offset =
    0;


  for (
    const chunk of chunks
  ) {

    result.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;
  }


  return result;
}


/* =====================================================
   Wait for WASM
   ===================================================== */

async function getWasmModule() {

  if (wasmModule) {
    return wasmModule;
  }


  if (
    !window.__wasmPromise
  ) {

    throw new Error(
      "WASM Promise 不存在"
    );
  }


  setStatus(
    "正在初始化 WebAssembly…"
  );


  wasmModule =
    await window.__wasmPromise;


  if (
    !wasmModule
  ) {

    throw new Error(
      "WASM Module 初始化失敗"
    );
  }


  if (
    !wasmModule.FS ||
    typeof wasmModule.FS.writeFile !==
    "function"
  ) {

    throw new Error(
      "WebAssembly 沒有提供 FS.writeFile"
    );
  }


  return wasmModule;
}


/* =====================================================
   Load model
   ===================================================== */

async function loadModel() {

  if (
    recognizer ||
    loading
  ) {

    return;
  }


  loading =
    true;

  loadButton.disabled =
    true;

  micButton.disabled =
    true;

  progressBox.hidden =
    false;


  try {

    /* -------------------------------------------------
       WASM
       ------------------------------------------------- */

    setProgress(
      0,
      "初始化 WebAssembly…"
    );

    setStatus(
      "正在初始化 WebAssembly…"
    );


    const module =
      await getWasmModule();


    log(
      "WASM Module OK"
    );


    /* -------------------------------------------------
       API
       ------------------------------------------------- */

    setStatus(
      "正在載入 sherpa-onnx API…"
    );


    if (
      typeof window.OfflineRecognizer !==
      "function"
    ) {

      /*
       * 新版 wrapper 有時候 API
       * 會掛在 SherpaOnnx namespace。
       */

      if (
        window.SherpaOnnx &&
        typeof window.SherpaOnnx.OfflineRecognizer ===
        "function"
      ) {

        window.OfflineRecognizer =
          window.SherpaOnnx.OfflineRecognizer;

      }
    }


    if (
      typeof window.OfflineRecognizer !==
      "function"
    ) {

      throw new Error(
        "找不到 OfflineRecognizer。請確認 sherpa-onnx-asr.js 版本與 WASM runtime 相容。"
      );
    }


    log(
      "OK：OfflineRecognizer"
    );


    /* -------------------------------------------------
       Model
       ------------------------------------------------- */

    setProgress(
      0,
      "開始載入 SenseVoice 模型…"
    );

    setStatus(
      "正在載入 SenseVoice INT8 模型…"
    );


    const modelData =
      await fetchBytes(
        "./assets/model.int8.onnx",
        (received, total) => {

          if (total > 0) {

            const percent =
              received /
              total *
              100;

            setProgress(
              percent,
              formatBytes(received) +
              " / " +
              formatBytes(total)
            );

            setStatus(
              "正在載入模型… " +
              Math.round(percent) +
              "%"
            );

          } else {

            /*
             * 沒有 Content-Length 時，
             * 至少顯示目前已收到多少。
             */

            setProgress(
              0,
              "已載入 " +
              formatBytes(received)
            );

            setStatus(
              "正在載入模型… " +
              formatBytes(received)
            );
          }

        }
      );


    log(
      "Model bytes: " +
      formatBytes(
        modelData.byteLength
      )
    );


    setProgress(
      100,
      formatBytes(
        modelData.byteLength
      ) +
      " / " +
      formatBytes(
        modelData.byteLength
      )
    );


    /* -------------------------------------------------
       Tokens
       ------------------------------------------------- */

    setStatus(
      "正在載入 tokens.txt…"
    );


    const tokensResponse =
      await fetch(
        "./assets/tokens.txt"
      );


    if (!tokensResponse.ok) {

      throw new Error(
        "tokens.txt HTTP " +
        tokensResponse.status
      );
    }


    const tokensText =
      await tokensResponse.text();


    log(
      "tokens.txt OK"
    );


    /* -------------------------------------------------
       Write files into WASM FS
       ------------------------------------------------- */

    setStatus(
      "正在把模型放入 WebAssembly…"
    );


    /*
     * 新版 Emscripten API：
     *
     * module.FS.writeFile()
     *
     * 不再使用：
     *
     * Module.FS_createDataFile()
     */

    module.FS.writeFile(
      "/model.int8.onnx",
      modelData
    );


    module.FS.writeFile(
      "/tokens.txt",
      tokensText
    );


    log(
      "OK：model.int8.onnx → WASM FS"
    );

    log(
      "OK：tokens.txt → WASM FS"
    );


    /* -------------------------------------------------
       Create recognizer
       ------------------------------------------------- */

    setProgress(
      100,
      "模型檔案完成"
    );

    setStatus(
      "正在建立 SenseVoice 辨識器…"
    );


    /*
     * 注意：
     *
     * 這裡傳入的是 Emscripten Module。
     */

    recognizer =
      new window.OfflineRecognizer(
        {
          featConfig: {
            sampleRate: 16000,
            featureDim: 80
          },

          modelConfig: {

            tokens:
              "./tokens.txt",

            numThreads:
              2,

            provider:
              "cpu",

            debug:
              0,

            senseVoice: {

              model:
                "./model.int8.onnx",

              language:
                "zh",

              useInverseTextNormalization:
                1
            }
          },

          decodingMethod:
            "greedy_search"

        },
        module
      );


    log(
      "OK：SenseVoice recognizer"
    );


    micButton.disabled =
      false;


    setProgress(
      100,
      "模型已準備完成"
    );

    progressPercent.textContent =
      "完成";


    setStatus(
      "模型已載入，可以開始說話。"
    );


  } catch (error) {

    console.error(
      "Load error:",
      error
    );


    recognizer =
      null;

    micButton.disabled =
      true;

    loadButton.disabled =
      false;


    setProgress(
      0,
      "載入失敗"
    );


    setStatus(
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


    log(
      "ERROR: " +
      (
        error &&
        error.stack
          ? error.stack
          : String(error)
      )
    );


  } finally {

    loading =
      false;
  }
}


/* =====================================================
   Start recording
   ===================================================== */

async function startRecording() {

  if (!recognizer) {

    setStatus(
      "請先載入模型。"
    );

    return;
  }


  if (recording) {
    return;
  }


  try {

    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }
      );


    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    const sampleRate =
      audioContext.sampleRate;


    log(
      "Audio sample rate: " +
      sampleRate
    );


    mediaSource =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    stream =
      recognizer.createStream();


    processor.onaudioprocess =
      event => {

        if (!stream) {
          return;
        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        const samples =
          new Float32Array(
            input.length
          );


        samples.set(
          input
        );


        /*
         * 新版 sherpa API：
         *
         * acceptWaveform({
         *   samples,
         *   sampleRate
         * })
         */

        stream.acceptWaveform({
          samples:
            samples,

          sampleRate:
            sampleRate
        });

      };


    mediaSource.connect(
      processor
    );


    silentGain =
      audioContext.createGain();

    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );

    silentGain.connect(
      audioContext.destination
    );


    recording =
      true;


    micButton.textContent =
      "⏹ 停止";

    micButton.classList.add(
      "stop"
    );


    setStatus(
      "🔴 錄音中…說完後按「停止」。"
    );


  } catch (error) {

    console.error(
      "Microphone error:",
      error
    );

    cleanupAudio();


    setStatus(
      "麥克風錯誤：" +
      (
        error.message ||
        String(error)
      )
    );
  }
}


/* =====================================================
   Stop recording
   ===================================================== */

async function stopRecording() {

  if (!recording) {
    return;
  }


  recording =
    false;

  micButton.disabled =
    true;


  setStatus(
    "錄音完成，正在辨識…"
  );


  try {

    if (processor) {

      processor.onaudioprocess =
        null;
    }


    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }


    if (audioContext) {

      try {

        await audioContext.close();

      } catch (_) {}
    }


    if (!stream) {

      throw new Error(
        "沒有建立音訊 stream"
      );
    }


    /*
     * decodeAsync：
     *
     * 避免 decode() 長時間阻塞
     * iPhone UI。
     */

    const result =
      await recognizer.decodeAsync(
        stream
      );


    if (
      result &&
      result.text
    ) {

      outputElement.value =
        result.text;

      setStatus(
        "完成。"
      );

    } else {

      setStatus(
        "沒有辨識到文字。"
      );
    }


    try {

      stream.free();

    } catch (_) {}


  } catch (error) {

    console.error(
      "Recognition error:",
      error
    );


    setStatus(
      "辨識失敗：" +
      (
        error.message ||
        String(error)
      )
    );


  } finally {

    cleanupAudio();


    micButton.disabled =
      false;

    micButton.textContent =
      "② 開始說話";

    micButton.classList.remove(
      "stop"
    );
  }
}


/* =====================================================
   Cleanup
   ===================================================== */

function cleanupAudio() {

  if (processor) {

    try {
      processor.disconnect();
    } catch (_) {}

  }


  if (mediaSource) {

    try {
      mediaSource.disconnect();
    } catch (_) {}

  }


  if (silentGain) {

    try {
      silentGain.disconnect();
    } catch (_) {}

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(track => {

        try {
          track.stop();
        } catch (_) {}

      });
  }


  processor =
    null;

  mediaSource =
    null;

  silentGain =
    null;

  mediaStream =
    null;

  audioContext =
    null;

  stream =
    null;
}


/* =====================================================
   Buttons
   ===================================================== */

loadButton.addEventListener(
  "click",
  loadModel
);


micButton.addEventListener(
  "click",
  async () => {

    if (recording) {

      await stopRecording();

    } else {

      await startRecording();

    }

  }
);


clearButton.addEventListener(
  "click",
  () => {

    outputElement.value =
      "";

    if (recognizer) {

      setStatus(
        "模型已載入，可以開始說話。"
      );

    } else {

      setStatus(
        "等待載入模型。"
      );

    }

  }
);


/* =====================================================
   Service Worker
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  navigator.serviceWorker
    .register(
      "./sw.js"
    )
    .then(
      registration => {

        console.log(
          "Service Worker OK:",
          registration.scope
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Service Worker:",
          error
        );

      }
    );
}


/* =====================================================
   Runtime error
   ===================================================== */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Global error:",
      event.error ||
      event.message
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled promise:",
      event.reason
    );

  }
);

</script>

</body>
</html>
