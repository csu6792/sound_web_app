<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>SenseVoice 離線中文語音輸入</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #edf2fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 24px 16px;
    }

    .box {
      background: #121a2b;
      border: 1px solid #293650;
      border-radius: 20px;
      padding: 20px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 5px;
    }

    .sub {
      color: #95a3ba;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 17px;
      margin: 0;
      background: #3272ed;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    button.gray {
      background: #29364c;
    }

    button.stop {
      background: #bd4054;
    }

    #status {
      margin: 14px 3px;
      padding: 11px;
      border-radius: 10px;
      background: #0c1423;
      color: #bac5d8;
      font-size: 13px;
      min-height: 18px;
      line-height: 1.5;
    }

    /* Progress */

    #progressBox {
      margin: 10px 3px 14px;
    }

    .progressInfo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 7px;
      color: #aebbd0;
      font-size: 13px;
    }

    #progressText {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #progressPercent {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .progressBar {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #202b40;
    }

    #progressFill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: #3272ed;
      transition: width .15s ease;
    }

    textarea {
      width: 100%;
      height: 250px;
      resize: vertical;
      border-radius: 14px;
      background: #080d17;
      color: white;
      border: 1px solid #2a3854;
      padding: 15px;
      font-size: 20px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #3272ed;
    }

    small {
      color: #8492a9;
      line-height: 1.6;
    }

    .tip {
      margin-top: 10px;
      color: #6f7f98;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main>
  <div class="box">

    <h1>🎙 SenseVoice INT8</h1>

    <div class="sub">
      sherpa-onnx · iPhone 瀏覽器離線中文語音輸入
    </div>

    <div class="buttons">
      <button id="load">
        ① 載入模型
      </button>

      <button id="mic" disabled>
        ② 開始說話
      </button>

      <button id="clear" class="gray">
        清除
      </button>
    </div>

    <div id="status">
      等待載入模型。
    </div>

    <div id="progressBox" hidden>

      <div class="progressInfo">
        <span id="progressText">
          準備下載…
        </span>

        <span id="progressPercent">
          0%
        </span>
      </div>

      <div class="progressBar">
        <div id="progressFill"></div>
      </div>

    </div>

    <textarea
      id="out"
      placeholder="辨識結果…"
      spellcheck="false"
    ></textarea>

    <p>
      <small>
        第一次使用需要載入約 227 MB 的 SenseVoice 模型與 WebAssembly。
        模型完成快取後，再次使用會快很多。
        請允許麥克風權限。
      </small>
    </p>

    <div class="tip">
      所有語音辨識均在瀏覽器本機執行，不需要把錄音上傳到伺服器。
    </div>

  </div>
</main>


<!-- =====================================================
     Emscripten Module
     ===================================================== -->

<script>
var Module = {
  locateFile: function (path) {
    return "./assets/" + path;
  }
};
</script>


<!-- =====================================================
     sherpa-onnx JavaScript API
     ===================================================== -->

<script src="./assets/sherpa-onnx-asr.js"></script>


<!-- =====================================================
     sherpa-onnx WebAssembly
     ===================================================== -->

<script src="./assets/sherpa-onnx-wasm-web.js"></script>


<script>
"use strict";


/* =====================================================
   DOM
   ===================================================== */

const $ = id =>
  document.getElementById(id);

const loadButton =
  $("load");

const micButton =
  $("mic");

const clearButton =
  $("clear");

const statusElement =
  $("status");

const outputElement =
  $("out");

const progressBox =
  $("progressBox");

const progressText =
  $("progressText");

const progressPercent =
  $("progressPercent");

const progressFill =
  $("progressFill");


/* =====================================================
   State
   ===================================================== */

let recognizer = null;

let audioContext = null;
let mediaStream = null;
let mediaSource = null;
let processor = null;
let silentGain = null;

let stream = null;

let recording = false;
let loading = false;


/* =====================================================
   UI
   ===================================================== */

function setStatus(message) {
  statusElement.textContent = message;
}


function setProgress(percent, text) {

  const safePercent =
    Math.max(
      0,
      Math.min(100, percent)
    );

  progressFill.style.width =
    safePercent + "%";

  progressPercent.textContent =
    Math.round(safePercent) + "%";

  if (text !== undefined) {
    progressText.textContent = text;
  }
}


/* =====================================================
   Format bytes
   ===================================================== */

function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes) ||
    bytes <= 0
  ) {
    return "0 MB";
  }

  const mb =
    bytes / (1024 * 1024);

  return mb.toFixed(1) + " MB";
}


/* =====================================================
   Service Worker
   ===================================================== */

async function registerServiceWorker() {

  if (!("serviceWorker" in navigator)) {

    console.warn(
      "Service Worker 不受目前瀏覽器支援。"
    );

    return;
  }

  try {

    const registration =
      await navigator.serviceWorker.register(
        "./sw.js"
      );

    console.log(
      "Service Worker registered:",
      registration.scope
    );

  } catch (error) {

    console.warn(
      "Service Worker 註冊失敗：",
      error
    );
  }
}


/* =====================================================
   Download with progress
   ===================================================== */

async function fetchWithProgress(
  url,
  onProgress
) {

  const response =
    await fetch(url);

  if (!response.ok) {

    throw new Error(
      "下載失敗：" +
      response.status +
      " " +
      response.statusText
    );
  }

  /*
   * 某些 Service Worker / cache response
   * 可能沒有 Content-Length。
   */
  const contentLength =
    response.headers.get(
      "Content-Length"
    );

  const total =
    contentLength
      ? parseInt(
          contentLength,
          10
        )
      : 0;

  /*
   * 如果沒有 ReadableStream，
   * 使用傳統 arrayBuffer。
   */
  if (!response.body) {

    const buffer =
      await response.arrayBuffer();

    onProgress(
      buffer.byteLength,
      total || buffer.byteLength
    );

    return new Uint8Array(buffer);
  }


  const reader =
    response.body.getReader();

  const chunks = [];

  let received = 0;


  while (true) {

    const {
      done,
      value
    } = await reader.read();

    if (done) {
      break;
    }

    if (value) {

      chunks.push(value);

      received +=
        value.byteLength;

      onProgress(
        received,
        total
      );
    }
  }


  /*
   * 合併所有 chunk。
   */

  const result =
    new Uint8Array(received);

  let offset = 0;

  for (const chunk of chunks) {

    result.set(
      chunk,
      offset
    );

    offset +=
      chunk.byteLength;
  }

  return result;
}


/* =====================================================
   Load SenseVoice
   ===================================================== */

async function loadModel() {

  if (
    recognizer ||
    loading
  ) {
    return;
  }

  loading = true;

  loadButton.disabled = true;

  micButton.disabled = true;

  progressBox.hidden = false;

  setProgress(
    0,
    "準備下載模型…"
  );

  setStatus(
    "正在下載 SenseVoice INT8 模型…"
  );


  try {

    /* -------------------------------------------------
       Download model
       ------------------------------------------------- */

    console.log(
      "Downloading model..."
    );

    const modelData =
      await fetchWithProgress(
        "./assets/model.int8.onnx",
        (received, total) => {

          if (total > 0) {

            const percent =
              received /
              total *
              100;

            setProgress(
              percent,
              formatBytes(received) +
              " / " +
              formatBytes(total)
            );

            setStatus(
              "正在下載 SenseVoice INT8 模型… " +
              Math.round(percent) +
              "%"
            );

          } else {

            setProgress(
              0,
              formatBytes(received)
            );

            setStatus(
              "正在下載 SenseVoice INT8 模型… " +
              formatBytes(received)
            );
          }
        }
      );


    /* -------------------------------------------------
       Download completed
       ------------------------------------------------- */

    setProgress(
      100,
      formatBytes(modelData.byteLength) +
      " / " +
      formatBytes(modelData.byteLength)
    );

    setStatus(
      "模型下載完成，正在載入…"
    );


    /* -------------------------------------------------
       Download tokens
       ------------------------------------------------- */

    setProgress(
      100,
      "模型完成"
    );

    setStatus(
      "正在載入 tokens.txt…"
    );


    const tokensResponse =
      await fetch(
        "./assets/tokens.txt"
      );

    if (!tokensResponse.ok) {

      throw new Error(
        "tokens.txt 下載失敗：" +
        tokensResponse.status
      );
    }


    const tokensText =
      await tokensResponse.text();


    /* -------------------------------------------------
       Emscripten FS
       ------------------------------------------------- */

    setStatus(
      "正在準備模型檔案…"
    );


    /*
     * 防止重複建立。
     */

    try {
      Module.FS_unlink(
        "/model.int8.onnx"
      );
    } catch (_) {}


    try {
      Module.FS_unlink(
        "/tokens.txt"
      );
    } catch (_) {}


    Module.FS_createDataFile(
      "/",
      "model.int8.onnx",
      modelData,
      true,
      true
    );


    Module.FS_createDataFile(
      "/",
      "tokens.txt",
      tokensText,
      true,
      true
    );


    /* -------------------------------------------------
       Create recognizer
       ------------------------------------------------- */

    setStatus(
      "正在建立 SenseVoice 辨識器…"
    );


    console.log(
      "Creating OfflineRecognizer..."
    );


    recognizer =
      new OfflineRecognizer(
        {
          featConfig: {
            sampleRate: 16000,
            featureDim: 80
          },

          modelConfig: {

            tokens:
              "./tokens.txt",

            numThreads:
              2,

            provider:
              "cpu",

            debug:
              0,

            senseVoice: {

              model:
                "./model.int8.onnx",

              language:
                "zh",

              useInverseTextNormalization:
                1
            }
          },

          decodingMethod:
            "greedy_search"

        },
        Module
      );


    /* -------------------------------------------------
       Ready
       ------------------------------------------------- */

    micButton.disabled = false;

    setProgress(
      100,
      "模型已準備完成"
    );

    progressPercent.textContent =
      "完成";

    setStatus(
      "模型已載入，可以開始說話。"
    );


    console.log(
      "SenseVoice ready."
    );


  } catch (error) {

    console.error(
      "Load model error:",
      error
    );

    recognizer = null;

    micButton.disabled = true;

    loadButton.disabled = false;

    setProgress(
      0,
      "載入失敗"
    );

    setStatus(
      "載入失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    loading = false;
  }
}


/* =====================================================
   Start recording
   ===================================================== */

async function startRecording() {

  if (!recognizer) {

    setStatus(
      "請先載入模型。"
    );

    return;
  }


  if (recording) {
    return;
  }


  try {

    /* -------------------------------------------------
       Microphone
       ------------------------------------------------- */

    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: {
            channelCount: 1,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        }
      );


    /* -------------------------------------------------
       AudioContext
       ------------------------------------------------- */

    audioContext =
      new AudioContext();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();
    }


    const inputSampleRate =
      audioContext.sampleRate;


    console.log(
      "AudioContext sample rate:",
      inputSampleRate
    );


    /* -------------------------------------------------
       Source
       ------------------------------------------------- */

    mediaSource =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    /* -------------------------------------------------
       Offline stream
       ------------------------------------------------- */

    stream =
      recognizer.createStream();


    /* -------------------------------------------------
       ScriptProcessor
       ------------------------------------------------- */

    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processor.onaudioprocess =
      event => {

        if (!stream) {
          return;
        }


        const input =
          event.inputBuffer
            .getChannelData(0);


        /*
         * 複製資料，避免 AudioBuffer
         * 被瀏覽器重用後內容改變。
         */

        const samples =
          new Float32Array(
            input.length
          );

        samples.set(input);


        /*
         * 目前直接交給 sherpa-onnx。
         *
         * 注意：
         * SenseVoice 模型設定為 16 kHz。
         *
         * 如果 iPhone 實際 AudioContext 是
         * 48000 Hz，後續建議加入真正
         * 的 resampler。
         */

        if (
          inputSampleRate !== 16000
        ) {

          console.warn(
            "AudioContext 實際取樣率：",
            inputSampleRate,
            "Hz"
          );
        }


        stream.acceptWaveform(
          inputSampleRate,
          samples
        );
      };


    /* -------------------------------------------------
       Connect audio graph
       ------------------------------------------------- */

    mediaSource.connect(
      processor
    );


    /*
     * 靜音輸出。
     *
     * ScriptProcessor 在部分瀏覽器需要
     * 連接 destination 才會正常觸發。
     *
     * gain = 0 不會播放麥克風聲音。
     */

    silentGain =
      audioContext.createGain();

    silentGain.gain.value =
      0;


    processor.connect(
      silentGain
    );

    silentGain.connect(
      audioContext.destination
    );


    /* -------------------------------------------------
       Recording state
       ------------------------------------------------- */

    recording = true;

    micButton.textContent =
      "⏹ 停止";

    micButton.classList.add(
      "stop"
    );


    setStatus(
      "🔴 錄音中…說完後按「停止」。"
    );


    console.log(
      "Recording started."
    );


  } catch (error) {

    console.error(
      "Microphone error:",
      error
    );

    cleanupAudio();

    setStatus(
      "麥克風錯誤：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );
  }
}


/* =====================================================
   Stop recording
   ===================================================== */

async function stopRecording() {

  if (!recording) {
    return;
  }


  recording = false;

  micButton.disabled = true;


  setStatus(
    "錄音完成，正在辨識…"
  );


  try {

    /*
     * 停止 audio callback。
     */

    if (processor) {

      processor.onaudioprocess =
        null;
    }


    /*
     * 停止 microphone。
     */

    if (mediaStream) {

      mediaStream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }


    /*
     * 關閉 AudioContext。
     */

    if (audioContext) {

      try {
        await audioContext.close();
      } catch (_) {}
    }


    /* -------------------------------------------------
       Decode
       ------------------------------------------------- */

    if (!stream) {

      throw new Error(
        "沒有建立音訊 stream。"
      );
    }


    console.log(
      "Decoding..."
    );


    recognizer.decode(
      stream
    );


    const result =
      recognizer.getResult(
        stream
      );


    console.log(
      "Recognition result:",
      result
    );


    if (
      result &&
      result.text
    ) {

      outputElement.value =
        result.text;

      setStatus(
        "完成。"
      );

    } else {

      setStatus(
        "沒有辨識到文字。"
      );
    }


    /*
     * Free stream。
     */

    try {

      stream.free();

    } catch (_) {}


  } catch (error) {

    console.error(
      "Recognition error:",
      error
    );

    setStatus(
      "辨識失敗：" +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    cleanupAudio();

    micButton.disabled =
      false;

    micButton.textContent =
      "② 開始說話";

    micButton.classList.remove(
      "stop"
    );
  }
}


/* =====================================================
   Cleanup audio
   ===================================================== */

function cleanupAudio() {

  if (processor) {

    try {
      processor.disconnect();
    } catch (_) {}
  }


  if (mediaSource) {

    try {
      mediaSource.disconnect();
    } catch (_) {}
  }


  if (silentGain) {

    try {
      silentGain.disconnect();
    } catch (_) {}
  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(track => {

        try {
          track.stop();
        } catch (_) {}

      });
  }


  processor = null;

  mediaSource = null;

  silentGain = null;

  mediaStream = null;

  audioContext = null;

  stream = null;
}


/* =====================================================
   Buttons
   ===================================================== */

loadButton.addEventListener(
  "click",
  loadModel
);


micButton.addEventListener(
  "click",
  async () => {

    if (recording) {

      await stopRecording();

    } else {

      await startRecording();
    }
  }
);


clearButton.addEventListener(
  "click",
  () => {

    outputElement.value =
      "";

    setStatus(
      recognizer
        ? "模型已載入，可以開始說話。"
        : "等待載入模型。"
    );
  }
);


/* =====================================================
   Startup
   ===================================================== */

registerServiceWorker();

</script>

</body>
</html>
