name: Build SenseVoice and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: sherpa-onnx

      - name: Install Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23

      - name: Prepare SenseVoice model BEFORE WASM build
        shell: bash
        run: |
          mkdir -p sherpa-onnx/wasm/asr/assets

          curl -L --fail --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2" \
            -o /tmp/sensevoice.tar.bz2

          tar -xjf /tmp/sensevoice.tar.bz2 -C /tmp

          cp \
            /tmp/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/model.int8.onnx \
            sherpa-onnx/wasm/asr/assets/model.int8.onnx

          cp \
            /tmp/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/tokens.txt \
            sherpa-onnx/wasm/asr/assets/tokens.txt

          ls -lh sherpa-onnx/wasm/asr/assets/

      - name: Build sherpa-onnx WebAssembly
        shell: bash
        run: |
          cd sherpa-onnx
          source ../emsdk/emsdk_env.sh
          ./build-wasm-simd-asr.sh

      - name: Assemble GitHub Pages
        shell: bash
        run: |
          mkdir -p public/assets

          cp index.html public/
          cp sw.js public/

          cp \
            sherpa-onnx/build-wasm-simd-asr/install/bin/wasm/asr/sherpa-onnx-wasm-main-asr.js \
            public/assets/

          cp \
            sherpa-onnx/build-wasm-simd-asr/install/bin/wasm/asr/sherpa-onnx-wasm-main-asr.wasm \
            public/assets/

          cp \
            sherpa-onnx/wasm/asr/sherpa-onnx-asr.js \
            public/assets/

          cp \
            sherpa-onnx/wasm/asr/assets/model.int8.onnx \
            public/assets/

          cp \
            sherpa-onnx/wasm/asr/assets/tokens.txt \
            public/assets/

          touch public/.nojekyll

          echo "===== Final files ====="
          ls -lh public/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
