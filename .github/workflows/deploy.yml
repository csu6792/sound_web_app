name: Build SenseVoice Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # 1. 下載你的 GitHub Pages 專案
      # ------------------------------------------------------------
      - name: Checkout website
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. 下載官方 sherpa-onnx
      # ------------------------------------------------------------
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: sherpa-onnx

      # ------------------------------------------------------------
      # 3. 安裝 Emscripten 4.0.23
      # ------------------------------------------------------------
      - name: Install Emscripten
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch 4.0.23 \
            https://github.com/emscripten-core/emsdk.git

          cd emsdk

          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23

      # ------------------------------------------------------------
      # 4. 檢查官方 sherpa-onnx WASM 設定
      # ------------------------------------------------------------
      - name: Verify sherpa-onnx WASM configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== build-wasm-simd-web.sh ====="
          sed -n '1,220p' sherpa-onnx/build-wasm-simd-web.sh

          echo
          echo "===== wasm/web/CMakeLists.txt ====="
          sed -n '1,220p' sherpa-onnx/wasm/web/CMakeLists.txt

          echo
          echo "===== wasm/wasm-common.cmake ====="
          sed -n '1,260p' sherpa-onnx/wasm/wasm-common.cmake

          echo
          echo "===== Verify FS export exists ====="

          grep -n \
            "EXPORTED_RUNTIME_METHODS" \
            sherpa-onnx/wasm/wasm-common.cmake

          grep -n \
            "'FS'" \
            sherpa-onnx/wasm/wasm-common.cmake

      # ------------------------------------------------------------
      # 5. 強制 Web build 明確 export FS
      #
      # 官方目前 wasm-common.cmake 已經包含：
      #
      # -sEXPORTED_RUNTIME_METHODS=[
      #   ...,
      #   'FS'
      # ]
      #
      # 這裡再加一次到 Web target 的 linker flags，
      # 確保最後產生的 sherpa-onnx-wasm-web.js 可以使用 FS。
      # ------------------------------------------------------------
      - name: Patch WebAssembly FS export
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("sherpa-onnx/wasm/web/CMakeLists.txt")
          text = path.read_text()

          old = 'string(APPEND MY_FLAGS " -s \\'EXPORT_NAME=\\"SherpaOnnx\\"\\' ")'

          new = '''string(APPEND MY_FLAGS " -s \\'EXPORT_NAME=\\"SherpaOnnx\\"\\' ")
          string(APPEND MY_FLAGS " -sEXPORTED_RUNTIME_METHODS=[\\'FS\\'] ")'''

          if old not in text:
              print("Expected Web CMake line was not found.")
              print(text)
              raise SystemExit(1)

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("===== Patched wasm/web/CMakeLists.txt =====")
          print(path.read_text())
          PY

      # ------------------------------------------------------------
      # 6. 編譯官方 WebAssembly
      # ------------------------------------------------------------
      - name: Build sherpa-onnx WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          source emsdk/emsdk_env.sh

          echo "===== Emscripten ====="
          emcc --version

          echo
          echo "===== Build sherpa-onnx ====="

          cd sherpa-onnx

          ./build-wasm-simd-web.sh

      # ------------------------------------------------------------
      # 7. 檢查產物
      # ------------------------------------------------------------
      - name: Verify generated WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          JS_FILE="sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.js"
          WASM_FILE="sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.wasm"

          echo "===== Generated files ====="

          ls -lh "$JS_FILE"
          ls -lh "$WASM_FILE"

          echo
          echo "===== Search for FS ====="

          grep -n "FS" "$JS_FILE" | head -20 || true

          echo
          echo "===== Search for exported runtime methods ====="

          grep -n "EXPORTED_RUNTIME_METHODS" "$JS_FILE" | head -10 || true

          echo
          echo "===== File sizes ====="

          du -h "$JS_FILE"
          du -h "$WASM_FILE"

      # ------------------------------------------------------------
      # 8. 建立 Pages public/assets
      # ------------------------------------------------------------
      - name: Prepare public directory
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf public
          mkdir -p public/assets

      # ------------------------------------------------------------
      # 9. 複製 WebAssembly
      # ------------------------------------------------------------
      - name: Copy WebAssembly runtime
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.js \
            public/assets/sherpa-onnx-wasm-web.js

          cp \
            sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.wasm \
            public/assets/sherpa-onnx-wasm-web.wasm

          cp \
            sherpa-onnx/wasm/asr/sherpa-onnx-asr.js \
            public/assets/sherpa-onnx-asr.js

          echo "===== public/assets ====="
          ls -lh public/assets/

      # ------------------------------------------------------------
      # 10. 最終檢查：
      #     不允許沒有 FS 的 WASM 被部署
      # ------------------------------------------------------------
      - name: Final FS export check
        shell: bash
        run: |
          set -euxo pipefail

          JS_FILE="public/assets/sherpa-onnx-wasm-web.js"

          echo "Checking $JS_FILE"

          if grep -q "FS" "$JS_FILE"; then
            echo "OK: FS detected in generated WebAssembly JavaScript."
          else
            echo "ERROR: FS was NOT found in generated WebAssembly JavaScript."
            exit 1
          fi

          echo
          echo "===== Final WASM assets ====="
          ls -lh public/assets/

      # ------------------------------------------------------------
      # 11. 複製網站
      # ------------------------------------------------------------
      - name: Copy website
        shell: bash
        run: |
          set -euxo pipefail

          cp index.html public/index.html

          if [ -f sw.js ]; then
            cp sw.js public/sw.js
          fi

          touch public/.nojekyll

          echo "===== Final public directory ====="
          find public -maxdepth 2 -type f -print

          echo
          echo "===== Final assets ====="
          ls -lh public/assets/

      # ------------------------------------------------------------
      # 12. GitHub Pages
      # ------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # 13. 上傳 Pages artifact
      # ------------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # --------------------------------------------------------------
  # Deploy
  # --------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
