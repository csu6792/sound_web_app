name: Build SenseVoice Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: sherpa-onnx

      - name: Install Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.23 \
            https://github.com/emscripten-core/emsdk.git

          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23

      - name: Build WebAssembly
        shell: bash
        run: |
          source emsdk/emsdk_env.sh

          cd sherpa-onnx

          mkdir -p build-web

          cd build-web

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_JNI=OFF \
            -DSHERPA_ONNX_ENABLE_TTS=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=OFF \
            -DSHERPA_ONNX_ENABLE_WASM=ON \
            -DSHERPA_ONNX_ENABLE_WASM_ASR=ON \
            -DSHERPA_ONNX_ENABLE_WASM_WEB=ON \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF

          make -j2
          make install

      - name: Download SenseVoice INT8
        shell: bash
        run: |
          mkdir -p public/assets

          curl -L --fail --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2" \
            -o /tmp/sensevoice.tar.bz2

          mkdir -p /tmp/sensevoice

          tar -xjf /tmp/sensevoice.tar.bz2 \
            -C /tmp/sensevoice \
            --strip-components=1

          cp /tmp/sensevoice/model.int8.onnx \
            public/assets/model.int8.onnx

          cp /tmp/sensevoice/tokens.txt \
            public/assets/tokens.txt

      - name: Copy WebAssembly files
        shell: bash
        run: |
          find sherpa-onnx/build-web/install/bin/wasm \
            -type f \
            -maxdepth 4 \
            -print

          cp $(find sherpa-onnx/build-web/install/bin/wasm \
            -name "*.js" | head -1) \
            public/assets/sherpa-onnx.js

          cp $(find sherpa-onnx/build-web/install/bin/wasm \
            -name "*.wasm" | head -1) \
            public/assets/sherpa-onnx.wasm

      - name: Copy website
        run: |
          cp index.html public/index.html
          cp sw.js public/sw.js
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
