name: Build SenseVoice Web

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =====================================================
      # Checkout website
      # =====================================================

      - name: Checkout website
        uses: actions/checkout@v4

      # =====================================================
      # Checkout sherpa-onnx
      # =====================================================

      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: sherpa-onnx

      # =====================================================
      # Install Emscripten
      # =====================================================

      - name: Install Emscripten
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch 4.0.23 \
            https://github.com/emscripten-core/emsdk.git

          cd emsdk

          ./emsdk install 4.0.23

          ./emsdk activate 4.0.23

      # =====================================================
      # Build sherpa-onnx WebAssembly
      #
      # IMPORTANT:
      #
      # Export Emscripten FS so the webpage can use:
      #
      #   Module.FS.writeFile(...)
      #
      # The official sherpa-onnx Web build script enables
      # WebAssembly/Web browser, but our webpage also needs
      # access to the Emscripten virtual filesystem.
      # =====================================================

      - name: Build official WebAssembly runtime
        shell: bash
        run: |
          set -euxo pipefail

          source emsdk/emsdk_env.sh

          cd sherpa-onnx

          export CFLAGS="-sEXPORTED_RUNTIME_METHODS=FS"
          export CXXFLAGS="-sEXPORTED_RUNTIME_METHODS=FS"

          ./build-wasm-simd-web.sh

      # =====================================================
      # Copy WebAssembly runtime
      # =====================================================

      - name: Copy WebAssembly runtime
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p public/assets

          cp \
            sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.js \
            public/assets/sherpa-onnx-wasm-web.js

          cp \
            sherpa-onnx/build-wasm-simd-web/install/bin/wasm/web/sherpa-onnx-wasm-web.wasm \
            public/assets/sherpa-onnx-wasm-web.wasm

          cp \
            sherpa-onnx/wasm/asr/sherpa-onnx-asr.js \
            public/assets/sherpa-onnx-asr.js

          echo "===== WebAssembly assets ====="

          ls -lh public/assets/

      # =====================================================
      # Verify Emscripten FS export
      #
      # This does NOT execute the WASM.
      # It checks that the generated JS contains the FS
      # runtime export we requested.
      # =====================================================

      - name: Verify WebAssembly FS export
        shell: bash
        run: |
          set -euxo pipefail

          JS_FILE="public/assets/sherpa-onnx-wasm-web.js"

          echo "Checking:"
          echo "$JS_FILE"

          if grep -q "FS" "$JS_FILE"; then
            echo "FS symbol detected in generated runtime."
          else
            echo "WARNING: FS symbol was not found by simple text check."
          fi

          ls -lh "$JS_FILE"

      # =====================================================
      # Copy website
      #
      # IMPORTANT:
      #
      # No model download here.
      #
      # model.int8.onnx is hosted on Hugging Face.
      # =====================================================

      - name: Copy website
        shell: bash
        run: |
          set -euxo pipefail

          cp index.html public/index.html

          if [ -f sw.js ]; then
            cp sw.js public/sw.js
          fi

          touch public/.nojekyll

          echo "===== Final public directory ====="

          find public -maxdepth 2 -type f -print

          echo "===== Final asset sizes ====="

          ls -lh public/assets/

      # =====================================================
      # Configure GitHub Pages
      # =====================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # Upload Pages artifact
      # =====================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # =========================================================
  # Deploy
  # =========================================================

  deploy:
    needs: build

    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
